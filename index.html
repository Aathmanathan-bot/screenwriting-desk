2 - About Structure", "chapterNum": "02"}, {"term": "Character Autonomy", "definition": "The idea, drawn from playwright Harold Pinter, that well-realized characters can seem to \"elude\" or resist their writer's original plan for them — and that a writer should follow this resistance rather than force characters to remain obedient to a predetermined blueprint, since doing so tends to make them feel lifeless.", "book": "Screenwriter's Workbook", "chapter": "05 - What Makes Good Character", "chapterNum": "05"}, {"term": "Character Biography (Craft Tool)", "definition": "A private, deep-background document tracing a character's life in decades (first ten years, second ten, and so on up to the start of the story), typically five to seven or more pages, used to build a well of resource for the writer even though most of it never appears on the page. A useful variant is writing it in the first person (\"My name is...\") to more quickly find the character's voice.", "book": "Screenwriter's Workbook", "chapter": "06 - The Tools of Character", "chapterNum": "06"}, {"term": "Character Biography (Workshop Version)", "definition": "A Week 2 assignment in Field's seven-week workshop: write your protagonist's full life history from birth to the moment the story begins, organized into three tracks — professional life, personal life, and private life. Done for the main character and one or two other major characters before any scenes are drafted.", "book": "Screenwriter's Workbook", "chapter": "00 - Introduction", "chapterNum": "Intro"}, {"term": "Character Change/Transformation", "definition": "One of the four qualities of character: whether and how a character evolves over the course of the story. Change is not mandatory — a character's deliberate failure to change (as with the mother in Ordinary People) can be just as dramatically meaningful as an arc of growth.", "book": "Screenwriter's Workbook", "chapter": "05 - What Makes Good Character", "chapterNum": "05"}, {"term": "Character Drives Action / Action Drives Character", "definition": "A stated either/or dynamic describing how a story's engine works: in some screenplays the character's inner nature generates what happens (character drives action), while in others external events and situations shape and reveal who the character is (action drives character). Field suggests most stories are predominantly one or the other.", "book": "Screenwriter's Workbook", "chapter": "01 - The Blank Page", "chapterNum": "01"}, {"term": "Character vs. Characterization", "definition": "A distinction between two layers of a character: character is the deep-seated nature of who someone is — their values, actions, and beliefs, revealed through what they do — while characterization is surface detail, the outward expression of taste and presentation (the car they drive, what they eat, the pictures on their wall).", "book": "Screenwriter's Workbook", "chapter": "06 - The Tools of Character", "chapterNum": "06"}, {"term": "Circle of Being", "definition": "A technique for locating one formative incident — typically occurring between ages 9 and 18, a window theorized to imprint most durably on adult personality — that leaves a lasting mark on a character and becomes an ongoing source of internal conflict throughout the story. The method is to picture the character as a circle divided into wedges (physical, emotional, mental, spiritual, social, political, traumatic, intellectual) and search within that age range for the incident that explains their present-day point of view, attitude, or wound. It doesn't need to appear on the page — even left entirely implied or offscreen, it gives the writer a consistent well to draw from when deciding how the character would react in any scene.", "book": "Screenwriter's Workbook", "chapter": "07 - Conflict and the Circle of Being", "chapterNum": "07"}, {"term": "Conflict Through Omission", "definition": "A device where dramatic tension is expressed through what characters deliberately avoid discussing rather than what they say — the avoidance itself carries the conflict and can layer in subtext (such as racial tension carried underneath idle small talk in a tense waiting scene).", "book": "Screenwriter's Workbook", "chapter": "07 - Conflict and the Circle of Being", "chapterNum": "07"}, {"term": "Coverage", "definition": "The standard studio document used to professionally evaluate a script before an executive reads it, consisting of the title/author/genre, a compressed logline, a full synopsis, an analysis rating categories like Character, Dialogue, and Structure (each as Excellent/Good/Fair/Poor with justification), and a final reader's recommendation on whether to pass or pursue the material.", "book": "Screenwriter's Workbook", "chapter": "17 - The Good Read", "chapterNum": "17"}, {"term": "Creative Research", "definition": "The practice, when adapting real events or documents (diaries, historical records), of inventing new scenes and dialogue that never literally happened while still preserving the integrity and spirit of the true source material. Transcribing real material verbatim tends to produce a lifeless draft; creative research is what brings it to life.", "book": "Screenwriter's Workbook", "chapter": "01 - The Blank Page", "chapterNum": "01"}, {"term": "Dialogue's Full Function Checklist", "definition": "Field's complete list of jobs dialogue should do beyond simply moving the story forward or revealing character: communicate necessary facts and information, establish and make character relationships feel real, give characters depth and purpose, reveal the story's and characters' conflicts, reveal characters' emotional states, and comment on the action.", "book": "Screenwriter's Workbook", "chapter": "14 - Writing Act II", "chapterNum": "14"}, {"term": "Direction (Line of Development)", "definition": "The throughline a screenplay needs — a sense of movement, step by step, toward a known destination. Field compares it to planning a trip: you need to know where you're going before you set out, not wander without a resolution in mind.", "book": "Screenwriter's Workbook", "chapter": "02 - About Structure", "chapterNum": "02"}, {"term": "Drama of Confrontation", "definition": "A technique for generating dialogue that both moves the story forward and reveals character: write a verbal confrontation between two characters who want different, opposing things in the moment, letting the clash itself produce the scene's tension.", "book": "Screenwriter's Workbook", "chapter": "06 - The Tools of Character", "chapterNum": "06"}, {"term": "Dramatic Need", "definition": "What a character wants to win, gain, get, or achieve over the course of the story — the central engine that drives the plot. It can shift at Plot Point I as the character's goal changes in response to the story's turn.", "book": "Screenwriter's Workbook", "chapter": "05 - What Makes Good Character", "chapterNum": "05"}, {"term": "Dramatic Premise vs. Dramatic Situation", "definition": "Two things Act I must establish: the dramatic premise (what the story is fundamentally about) and the dramatic situation (the specific circumstances surrounding the action), alongside the character's professional, personal, and private life — all needed before the story can move into Act II.", "book": "Screenwriter's Workbook", "chapter": "03 - The Paradigm", "chapterNum": "03"}, {"term": "Dramatic Reality", "definition": "A three-step model for turning true events or personal experience into workable screen material: Reality (what actually happened), Unreality (invented incidents that never happened but serve the drama), and Dramatic Reality (the fusion of the two into something that actually plays on screen). Field's advice is not to feel bound to literal reality, since sticking too closely to what really happened usually makes for a thin story.", "book": "Screenwriter's Workbook", "chapter": "01 - The Blank Page", "chapterNum": "01"}, {"term": "Dramatic Recreation", "definition": "One of the two writing modes used inside the four-page treatment: a short, visually specific, scene-level description (like a mini-script excerpt) reserved for only the four anchor beats — the opening, Plot Point I, Plot Point II, and the ending.", "book": "Screenwriter's Workbook", "chapter": "04 - Four Pages", "chapterNum": "04"}, {"term": "Dramatic Structure (Formal Definition)", "definition": "Field's formal definition, borrowed loosely from dictionary usage: \"a linear arrangement of related incidents, episodes, and events leading to a dramatic resolution.\" Structure is not a rigid formula but a context — a space, like a suitcase, that holds whatever content a writer puts into it.", "book": "Screenwriter's Workbook", "chapter": "02 - About Structure", "chapterNum": "02"}, {"term": "Ending Philosophy (Hope over Nihilism)", "definition": "Field's own stated point of view, not presented as a hard rule: screenwriters carry a certain responsibility to their audience, and should default toward resolutions built on hope, unity, and self-worth rather than nihilism whenever the story can honestly support it — while still allowing for bleak, earned endings when darkness is integral to the story rather than a reflexive default.", "book": "Screenwriter's Workbook", "chapter": "15 - Act III - The Resolution", "chapterNum": "15"}, {"term": "Explanation Scenes (to Avoid)", "definition": "Scenes where a character narrates their own intentions in dialogue instead of the writer simply showing the action and cutting to its result. Field's example: cut a line like \"I need a jade ring\" followed by shopping and showing it off, down to just entering the store and cutting straight to showing the ring off at the party.", "book": "Screenwriter's Workbook", "chapter": "16 - The Rewrite", "chapterNum": "16"}, {"term": "First Half of Act II / Second Half of Act II", "definition": "The two roughly 30-page halves that Act II's Confrontation section is split into by the Mid-Point — the First Half running from Plot Point I to the Mid-Point, and the Second Half running from the Mid-Point to Plot Point II. Splitting Act II this way lets each half be outlined and paced as its own manageable unit, rather than treating the full 60 pages as one undifferentiated block.", "book": "Screenwriter's Workbook", "chapter": "12 - Finding the Mid-Point", "chapterNum": "12"}, {"term": "Flashback Test", "definition": "A practical rule for deciding whether to use a flashback at all: it must do one of the two things any scene must do — move the story forward or reveal character. A flashback included only because the writer doesn't know another way to convey backstory will call attention to itself and fail.", "book": "Screenwriter's Workbook", "chapter": "08 - Of Time and Memory", "chapterNum": "08"}, {"term": "Flashpresent", "definition": "A term from screenwriter Waldo Salt: a flashback isn't really about depicting the past — it's a window into what the character is thinking or feeling right now, in the present moment of the scene. Since the audience experiences it through the character's current consciousness, a flashback functions as an expression of character rather than a mechanical plot device for conveying backstory.", "book": "Screenwriter's Workbook", "chapter": "08 - Of Time and Memory", "chapterNum": "08"}, {"term": "Four-Page Treatment (\"Kick in the Ass\" Exercise)", "definition": "Field's signature exercise for forcing shape onto a raw, unformed idea: write a narrative treatment of exactly four pages, following a fixed page budget — a half page each of vivid scene-level \"dramatic recreation\" for the opening, Plot Point I, Plot Point II, and the ending, with brief narrative summary filling in the rest of each act. The tight page limit is what makes the exercise valuable, forcing early clarity rather than allowing a vague idea to sprawl.", "book": "Screenwriter's Workbook", "chapter": "04 - Four Pages", "chapterNum": "04"}, {"term": "Internal Conflict vs. External Conflict", "definition": "The two sources of dramatic conflict: internal conflict comes from forces inside a character (fear, doubt, guilt, hesitation), while external conflict comes from forces outside them (war, weather, terrain, pursuit, an antagonist). Most screenplays blend both, and one often causes the other to surface.", "book": "Screenwriter's Workbook", "chapter": "07 - Conflict and the Circle of Being", "chapterNum": "07"}, {"term": "Internal vs. External Obstacles", "definition": "The two categories of obstacle standing between a character and their dramatic need: internal obstacles are emotional forces inside the character (fear, self-doubt), external obstacles are outside forces (an antagonist, physical danger, circumstance). Most real characters face a combination of both.", "book": "Screenwriter's Workbook", "chapter": "03 - The Paradigm", "chapterNum": "03"}, {"term": "Key Incident", "definition": "A single, specific incident that anchors an entire story and everything radiates from it — even in fractured, nonlinear films like Pulp Fiction (Jules and Vincent retrieving Marsellus Wallace's briefcase), every storyline still connects back to one key incident that holds the piece together.", "book": "Screenwriter's Workbook", "chapter": "02 - About Structure", "chapterNum": "02"}, {"term": "Logline", "definition": "A four-to-five line summary of a script's plot, used both in professional coverage documents and as a compression exercise for writers — Field recommends studying TV Guide-style loglines as models of maximum compression.", "book": "Screenwriter's Workbook", "chapter": "17 - The Good Read", "chapterNum": "17"}, {"term": "Maximum Dramatic Value (MDV)", "definition": "The organizing goal of structure: arranging a screenplay's events and scenes so they deliver the greatest possible emotional and dramatic impact, rather than simply presenting incidents in the order they might have occurred.", "book": "Screenwriter's Workbook", "chapter": "02 - About Structure", "chapterNum": "02"}, {"term": "Mid-Point", "definition": "An incident, episode, or event occurring around page 60 of the script that functions as a link in the chain of dramatic action, connecting the First Half of Act II (from Plot Point I to the Mid-Point) to the Second Half of Act II (from the Mid-Point to Plot Point II). It behaves like any other Plot Point in that it hooks into the action and spins it in a new direction, but its defining job is structural: it breaks the unwieldy 60-page Act II into two workable 30-page units that can be outlined with the same card-based methods used for Act I. It can only be located after the ending, beginning, Plot Point I, and Plot Point II are already known.", "book": "Screenwriter's Workbook", "chapter": "12 - Finding the Mid-Point", "chapterNum": "12"}, {"term": "Narrative Synopsis", "definition": "The second writing mode used inside the four-page treatment: general, summarized prose used to cover the bulk of the action within Act I, Act II, and Act III, as opposed to the vivid scene-by-scene detail reserved for the four anchor beats.", "book": "Screenwriter's Workbook", "chapter": "04 - Four Pages", "chapterNum": "04"}, {"term": "Newton's Third Law (of Character)", "definition": "A recurring reminder that a character must be active — causing scenes to happen through their own choices and actions, rather than merely absorbing or reacting to events that happen around them.", "book": "Screenwriter's Workbook", "chapter": "11 - The Second and Third Ten Pages", "chapterNum": "11"}, {"term": "Open System vs. Closed System", "definition": "A framing for how a screenplay should be written: a closed system (like a rock) has no exchange with its environment, while an open system (like a city) is in constant exchange with its surroundings. Writing a screenplay is an open system — if a character organically wants to do something other than what was planned for a scene, the writer should listen to that impulse rather than force the pre-planned version.", "book": "Screenwriter's Workbook", "chapter": "02 - About Structure", "chapterNum": "02"}, {"term": "Opposite Point-of-View Technique", "definition": "A technique for breaking through a stuck scene: write the scene first entirely from the other character's point of view and reasoning (for example, why a casting director genuinely believes the protagonist is wrong for the part) before flipping back to write the protagonist's side — manufacturing real conflict on the page instead of fighting the blank page alone.", "book": "Screenwriter's Workbook", "chapter": "14 - Writing Act II", "chapterNum": "14"}, {"term": "Paradigm", "definition": "Field's term for the underlying structural model of a screenplay — literally \"a model, an example, or a conceptual scheme\" — often illustrated as a table with four legs: the beginning, Plot Point I, Plot Point II, and the ending, all needed to hold up the story.", "book": "Screenwriter's Workbook", "chapter": "03 - The Paradigm", "chapterNum": "03"}, {"term": "Parking a New Idea", "definition": "A discipline for handling a powerful new idea that strikes while finishing Act III: instead of chasing it, jot it down separately in two or three pages, set it aside, and return to finishing the current script — protecting momentum on the draft actually being resolved.", "book": "Screenwriter's Workbook", "chapter": "15 - Act III - The Resolution", "chapterNum": "15"}, {"term": "Pinch I / Pinch II", "definition": "Two anchoring beats, one roughly at the midpoint of each 30-page half of Act II (Pinch I around page 45, Pinch II around page 75), whose sole job is to \"pinch\" the story line back on track — keeping it moving toward the Mid-Point (Pinch I) or toward Plot Point II (Pinch II). A Pinch can be any kind of scene — action, dialogue, or a quiet character beat — its defining feature is its function of preventing a 15-page stretch from drifting, not any particular form. Symmetry between the two Pinches (a causal link from one to the other) is common but not required.", "book": "Screenwriter's Workbook", "chapter": "13 - First Half, Second Half", "chapterNum": "13"}, {"term": "Plot (Field's Definition)", "definition": "Field's plain definition of plot: simply \"what happens\" in the story. He advises that at the idea stage, before you've settled on your subject (action plus character), plot should be the furthest thing from your mind — it gets worked out later, once the subject is clear.", "book": "Screenwriter's Workbook", "chapter": "01 - The Blank Page", "chapterNum": "01"}, {"term": "Plot Point", "definition": "Any incident, episode, or event that hooks into the action of a story and spins it around into a new direction. A Plot Point can take almost any form — a physical action, a silent gesture, an action sequence, or a single line of dialogue.", "book": "Screenwriter's Workbook", "chapter": "03 - The Paradigm", "chapterNum": "03"}, {"term": "Point of View (Character Quality)", "definition": "A character's belief system or way of seeing the world, acquired through their life experience — not inherently right or wrong, just the lens ('the World is as you see it') through which they interpret everything that happens to them.", "book": "Screenwriter's Workbook", "chapter": "05 - What Makes Good Character", "chapterNum": "05"}, {"term": "Resolution (Act III)", "definition": "The organizing principle of Act III (roughly the final 30 pages, from Plot Point II to the end): Resolution means solution, not simply \"the ending\" as one specific scene. Act III is usually anchored by only one to three dramatic elements or unresolved threads that need to be settled, and is often the easiest act to write since the story's internal logic has stabilized by this point.", "book": "Screenwriter's Workbook", "chapter": "15 - Act III - The Resolution", "chapterNum": "15"}, {"term": "Revision-Percentage Map", "definition": "A calibration table Field offers for how heavily each section of a script typically needs to be rewritten during the mechanical draft: Act I about 80–85%, the First Half of Act II about 50–60%, the Second Half of Act II about 25–30%, and Act III only about 10–15% — because Act I and the early part of Act II are usually where the story drifted most from its original plan, while the throughline has stabilized by Act III.", "book": "Screenwriter's Workbook", "chapter": "16 - The Rewrite", "chapterNum": "16"}, {"term": "Scene Purpose Rule", "definition": "Every scene in a screenplay must do one of two things: move the story forward, or reveal information about character. Anything that does neither should be cut — especially in Act I.", "book": "Screenwriter's Workbook", "chapter": "03 - The Paradigm", "chapterNum": "03"}, {"term": "Screenplay vs. Novel vs. Play", "definition": "Field's distinction between the three narrative forms by where the drama actually lives: a novel plays out inside the protagonist's head (internal point of view, thoughts, memory), a play is spoken action witnessed by an audience across a \"fourth wall,\" and a screenplay tells its story through pictures, dialogue, and description organized within dramatic structure — film is fundamentally a visual medium.", "book": "Screenwriter's Workbook", "chapter": "02 - About Structure", "chapterNum": "02"}, {"term": "Sequence (Formal Definition)", "definition": "A series of scenes connected by one single idea, possessing its own definite beginning, middle, and end — Field's working definition, arrived at while studying forty produced scripts as head of a story department.", "book": "Screenwriter's Workbook", "chapter": "10 - The First Ten Pages", "chapterNum": "10"}, {"term": "Seven-Week Workshop Cycle", "definition": "The rhythm Field's actual screenwriting workshops (and this book) follow: weeks 1–4 are preparation (subject, character, 3x5 cards for Act I, back story), weeks 5–7 are writing at roughly ten pages a week until Act I is finished (about 20–30 pages), and the whole cycle then repeats for Act II and for Act III plus the rewrite.", "book": "Screenwriter's Workbook", "chapter": "00 - Introduction", "chapterNum": "Intro"}, {"term": "Sub-Dramatic Context", "definition": "A one-phrase description of what one 30-page half of Act II is actually about, distinct from Act II's overall context of Confrontation — for example, a First Half sub-context of \"revealing their unhappy marriages\" giving way to a Second Half sub-context of \"an unsustainable arrangement.\" Defining a sub-dramatic context for each half of Act II gives the writer two smaller, differently-themed blocks to build instead of one long, undifferentiated act.", "book": "Screenwriter's Workbook", "chapter": "13 - First Half, Second Half", "chapterNum": "13"}, {"term": "Subtext", "definition": "What is not said in a scene — the real meaning or tension running underneath the literal dialogue. Characters often talk around the thing that actually matters, and the audience senses the unspoken truth beneath the polite surface conversation.", "book": "Screenwriter's Workbook", "chapter": "06 - The Tools of Character", "chapterNum": "06"}, {"term": "Telescoping", "definition": "A polish-draft technique for tightening a script: merging a scene from one half of Act II with a related scene from the other half into a single, more efficient combined scene.", "book": "Screenwriter's Workbook", "chapter": "16 - The Rewrite", "chapterNum": "16"}, {"term": "Ten-Page Zones of Act I", "definition": "Field's breakdown of Act I into three distinct 10-page functional units, each with its own job: pages 1–10 (Set-Up) establish the main character, premise, and situation; pages 11–20 (\"a day in the life\") keep the main character in almost every scene so the audience learns who they are through representative action, rather than plot mechanics; pages 21–30 use only one or two transitional scenes to bridge from that \"day in the life\" material into Plot Point I. This granular three-zone breakdown of Act I does not appear in Field's earlier book Screenplay.", "book": "Screenwriter's Workbook", "chapter": "11 - The Second and Third Ten Pages", "chapterNum": "11"}, {"term": "The Bumblebee Parable", "definition": "A metaphor, drawn from a bumblebee trapped in Field's bathroom repeatedly slamming into a closed windowpane inches from an open one, for a writer grinding against a scene or structural approach that fundamentally doesn't work while refusing to stop and look for another way out. The lesson: when something isn't working, stop and reassess whether the whole approach — not just the execution — may be wrong, rather than continuing to force it.", "book": "Screenwriter's Workbook", "chapter": "14 - Writing Act II", "chapterNum": "14"}, {"term": "The Critic's Page", "definition": "An anti-writer's-block exercise: keep a separate sheet titled \"Critic's Page\" next to your script pages, and whenever a self-critical thought interrupts your writing, write it down there instead of fighting it, then keep writing the script. After a few days, reading the Critic's Pages back typically reveals the same handful of negative thoughts on repeat — recognizing the inner critic as a fixed, repetitive loop (not real feedback) defuses its power to stop you writing.", "book": "Screenwriter's Workbook", "chapter": "14 - Writing Act II", "chapterNum": "14"}, {"term": "The Reveal", "definition": "The one specific piece of information a given scene exists to deliver — whether through action or through character. Field's guidance is that a writer should always be able to name a scene's reveal; if they can't, the scene likely doesn't have a clear purpose yet.", "book": "Screenwriter's Workbook", "chapter": "10 - The First Ten Pages", "chapterNum": "10"}, {"term": "Theme vs. Plot", "definition": "A distinction illustrated through screenwriter Tony Gilroy's account of writing The Bourne Supremacy: a script that feels directionless often needs a theme (an underlying idea, like atonement), not more plot events. Once the theme is found, it typically generates the key incident needed to structure the rest of the story.", "book": "Screenwriter's Workbook", "chapter": "08 - Of Time and Memory", "chapterNum": "08"}, {"term": "Theory of Illumination", "definition": "A concept borrowed from Henry James: other characters in a story \"light up\" different facets of the main character through their interactions with them, revealing dimensions of the protagonist that couldn't be shown any other way.", "book": "Screenwriter's Workbook", "chapter": "06 - The Tools of Character", "chapterNum": "06"}, {"term": "Three Diagnostic Essays (Rewrite)", "definition": "A self-assessment exercise done before the mechanical rewrite: write short answers to (1) What originally attracted me to this idea? (2) What kind of story did I actually end up writing? and (3) What do I have to do to make what I did equal what I wanted to do? The exercise surfaces where a script has drifted from its original intention so the rewrite can correct it.", "book": "Screenwriter's Workbook", "chapter": "16 - The Rewrite", "chapterNum": "16"}, {"term": "Three Stages of the First Draft", "definition": "Field's model of a screenplay's rewrite process as three distinct, separable stages, each with its own character: the words-on-paper draft (getting the whole story down), the mechanical draft (correcting story-line drift and bringing the script to proper length, not a creative pass), and the polish draft (line-by-line, scene-by-scene refinement to produce the best possible read).", "book": "Screenwriter's Workbook", "chapter": "16 - The Rewrite", "chapterNum": "16"}, {"term": "Time Frame (Act II Duration Decision)", "definition": "The deliberate choice of how much story-time Act II covers (hours, weeks, or years), made before outlining scenes. Leaving this undefined tends to cause new writers to scatter incidents randomly; deciding it up front lets devices like seasonal change, on-screen dates, or references to real calendar events be used intentionally to show time passing.", "book": "Screenwriter's Workbook", "chapter": "13 - First Half, Second Half", "chapterNum": "13"}, {"term": "Transitions", "definition": "The visual and audio bridges written between scenes — Field argues writing these is the screenwriter's job, not the director's or editor's, and a mark of professional craft. The four basic types are picture-to-picture, sound-to-sound, music-to-music, and effect-to-effect (dissolves, smash cuts, fade-outs); the rule of thumb is that if an audience consciously notices a transition, it probably isn't working.", "book": "Screenwriter's Workbook", "chapter": "14 - Writing Act II", "chapterNum": "14"}];</script>

var ROADMAP = [
  {id:'p0', title:'Before You Write a Page', steps:[
    {id:'s00', text:"Read the Introduction and “The Blank Page” — get past the blank-page fear; understand that structure comes before writing."},
    {id:'s01', text:"Read “About Structure” and “The Paradigm” — internalize the three-act paradigm (Set-Up / Confrontation / Resolution) and Plot Points I & II."}
  ]},

/* ---------------- Utilities ---------------- */
function cid(){ return 'c' + Math.random().toString(36).slice(2,10); }
function pid(){ return 'p' + Math.random().toString(36).slice(2,10); }
function esc(s){ return (s||'').replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function findGlossaryLink(term){
  var t = (term||'').toLowerCase();
  var bestKey = null;
  Object.keys(GLOSSARY_LINKS).forEach(function(key){
    if(t.indexOf(key) !== -1 && (!bestKey || key.length > bestKey.length)) bestKey = key;
  });
  return bestKey ? GLOSSARY_LINKS[bestKey] : null;
}

/* ---------------- Storage layer (db capability, localStorage fallback) ---------------- */
/*
 * Storage layer. Deliberately NOT using a live onSnapshot subscription:
 * a real-time listener re-fires (with hasPendingWrites echoes) on every
 * write this same tab makes, and re-rendering from that would blow away
 * whatever the user is mid-typing. Every mutation below is applied to the
 * in-memory `state.projects` object FIRST (by the caller, before calling
 * store.update/create/remove) and persisted to storage as a fire-and-forget
 * background write — state.projects is the single source of truth for
 * rendering, storage is just where it's backed up to.
 */
var store = {
  mode: 'local',
  db: null,
  async init(){
    try{
      var db = await claude.use('db');
      if(db){ this.db = db; this.mode = 'db'; }
    }catch(e){}
    if(this.mode === 'local' && !localStorage.getItem('sd_projects_v1')){
      localStorage.setItem('sd_projects_v1', JSON.stringify({}));
    }
  },
  async fetchAll(){
    if(this.mode === 'db'){
      var snap = await this.db.collection('projects').get();
      var out = [];
      snap.docs.forEach(function(d){ if(d.exists){ var data = d.data(); data.id = d.id; out.push(data); } });
      out.sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
      return out;
    } else {
      var all = JSON.parse(localStorage.getItem('sd_projects_v1') || '{}');
      var out2 = Object.keys(all).map(function(k){ var v = all[k]; v.id = k; return v; });
      out2.sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
      return out2;
    }
  },
  /** Creates the project in storage and returns the full object (with id) — caller pushes it into state.projects. */
  async create(data){
    data.createdAt = Date.now(); data.updatedAt = Date.now();
    if(this.mode === 'db'){
      var ref = await this.db.collection('projects').add(data);
      data.id = ref.id;
      return data;
    } else {
      var all = JSON.parse(localStorage.getItem('sd_projects_v1') || '{}');
      var id = pid();
      all[id] = data;
      localStorage.setItem('sd_projects_v1', JSON.stringify(all));
      data.id = id;
      return data;
    }
  },
  /** Fire-and-forget background save. Caller must already have applied this same change to the in-memory project object. */
  update(id, patch){
    patch.updatedAt = Date.now();
    if(this.mode === 'db'){
      this.db.collection('projects').doc(id).update(patch).catch(function(e){ console.error('Screenwriting Desk: save failed', e); });
    } else {
      var all = JSON.parse(localStorage.getItem('sd_projects_v1') || '{}');
      if(!all[id]) return;
      Object.keys(patch).forEach(function(k){
        if(k === 'roadmap' && all[id].roadmap){
          Object.assign(all[id].roadmap, patch.roadmap);
        } else {
          all[id][k] = patch[k];
        }
      });
      localStorage.setItem('sd_projects_v1', JSON.stringify(all));
    }
  },
  /** Fire-and-forget background delete. Caller must already have removed it from state.projects. */
  remove(id){
    if(this.mode === 'db'){
      this.db.collection('projects').doc(id).delete().catch(function(e){ console.error('Screenwriting Desk: delete failed', e); });
    } else {
      var all = JSON.parse(localStorage.getItem('sd_projects_v1') || '{}');
      delete all[id];
      localStorage.setItem('sd_projects_v1', JSON.stringify(all));
    }
  }
};

function renderSidebar(){

    btn.innerHTML = '<span class="name"></span><span class="meta mono"></span>';
    btn.querySelector('.name').textContent = p.name || 'Untitled';
    btn.querySelector('.meta').textContent = stepsDone + '/17 · ' + (p.cards ? p.cards.length : 0) + ' cards · ' + (p.characters ? p.characters.length : 0) + ' chars';
    btn.onclick = function(){ state.currentId = p.id; renderAll(); };
    btn.ondblclick = function(){ startRename(p, btn); };
    var del = document.createElement('button');
    del.className = 'icon-btn';
    del.title = 'Delete project';
    del.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
    var armed = false, armTimer = null;
    del.onclick = function(e){
      e.stopPropagation();
      if(!armed){
        armed = true;
        del.classList.add('armed');
        del.title = 'Click again to delete permanently';
        del.innerHTML = 'Delete?';
        armTimer = setTimeout(function(){
          armed = false;
          del.classList.remove('armed');
          del.title = 'Delete project';
          del.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
        }, 2500);
        return;
      }
      clearTimeout(armTimer);
      store.remove(p.id);
      state.projects = state.projects.filter(function(x){ return x.id !== p.id; });
      if(state.currentId === p.id) state.currentId = null;
      renderAll();

function startRename(p, btn){
  var input = document.createElement('input');
  input.className = 'rename-input';
  input.value = p.name || '';
  btn.innerHTML = '';
  btn.appendChild(input);
  input.focus(); input.select();
  function commit(){
    var v = input.value.trim() || 'Untitled';
    p.name = v;
    store.update(p.id, {name: v});
    renderSidebar();
  }
  input.onblur = commit;
  input.onkeydown = function(e){ if(e.key === 'Enter'){ input.blur(); } };
}

function renderRoadmap(content, proj){
  content.innerHTML = '';
  var totalSteps = ROADMAP.reduce(function(n,ph){ return n + ph.steps.length; }, 0);
  var done = proj.roadmap ? Object.values(proj.roadmap).filter(Boolean).length : 0;

  var pw = document.createElement('div');
  pw.className = 'progress-wrap';
  pw.innerHTML = '<div class="progress-track"><div class="progress-fill"></div></div>' +
    '<div class="progress-label"><span class="mono"></span> steps done</div>';
  var pwFill = pw.querySelector('.progress-fill');
  var pwCount = pw.querySelector('.mono');
  function refreshTotals(){
    var d = proj.roadmap ? Object.values(proj.roadmap).filter(Boolean).length : 0;
    pwFill.style.width = Math.round(d/totalSteps*100) + '%';
    pwCount.textContent = d + '/' + totalSteps;
  }
  refreshTotals();
  content.appendChild(pw);

  ROADMAP.forEach(function(phase, pi){
    var doneInPhase = phase.steps.filter(function(s){ return proj.roadmap && proj.roadmap[s.id]; }).length;
    var el = document.createElement('div');
    el.className = 'phase' + (doneInPhase === phase.steps.length ? '' : (pi === firstOpenPhaseIndex(proj) ? ' open' : ''));
    el.innerHTML =
      '<div class="phase-head">' +
        '<span class="phase-num">' + (pi+1) + '</span>' +
        '<span class="phase-title">' + esc(phase.title) + '</span>' +
        '<span class="phase-count mono">' + doneInPhase + '/' + phase.steps.length + '</span>' +
        '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>' +
      '</div>' +
      '<div class="phase-steps"></div>';
    el.querySelector('.phase-head').onclick = function(){ el.classList.toggle('open'); };
    var phaseCountEl = el.querySelector('.phase-count');
    var stepsWrap = el.querySelector('.phase-steps');
    phase.steps.forEach(function(step){
      var checked = !!(proj.roadmap && proj.roadmap[step.id]);
      var row = document.createElement('div');
      row.className = 'step' + (checked ? ' done' : '');
      var cbId = 'cb_' + step.id;
      row.innerHTML = '<input type="checkbox" id="' + cbId + '" ' + (checked?'checked':'') + '><div class="step-row"><label for="' + cbId + '"></label></div>';
      row.querySelector('label').textContent = step.text;
      if(step.linkTab && TAB_META[step.linkTab]){
        var jump = document.createElement('button');
        jump.className = 'jump-link';
        jump.type = 'button';
        jump.textContent = '→ ' + TAB_META[step.linkTab].title;
        jump.onclick = function(e){ e.stopPropagation(); state.tab = step.linkTab; renderAll(); };
        row.querySelector('.step-row').appendChild(jump);
      }
      row.querySelector('input').onchange = function(e){
        if(!proj.roadmap) proj.roadmap = {};
        proj.roadmap[step.id] = e.target.checked;
        store.update(proj.id, {roadmap: proj.roadmap});
        row.classList.toggle('done', e.target.checked);
        var nowDone = phase.steps.filter(function(s){ return proj.roadmap[s.id]; }).length;
        phaseCountEl.textContent = nowDone + '/' + phase.steps.length;
        refreshTotals();
      };
      stepsWrap.appendChild(row);
    });
    content.appendChild(el);
  });

  var cp = document.createElement('div');
  cp.className = 'checkpoint-strip';
  cp.innerHTML = '<div class="display">Full checkpoint chain to keep visible while drafting</div>' +
    '<div class="chain">Beginning → Plot Point I → Pinch I → Mid-Point → Pinch II → Plot Point II → Resolution</div>';
  content.appendChild(cp);
}

function firstOpenPhaseIndex(proj){
  for(var i=0;i<ROADMAP.length;i++){
    var incomplete = ROADMAP[i].steps.some(function(s){ return !(proj.roadmap && proj.roadmap[s.id]); });
    if(incomplete) return i;
  }
  return 0;
}

var openCharId = null;

function makeField(obj, key, label, placeholder, saveFn, multiline){
  var wrap = document.createElement('div');
  wrap.className = 'field';
  var lab = document.createElement('div');
  lab.className = 'field-label';
  lab.textContent = label;
  wrap.appendChild(lab);
  var input = document.createElement(multiline ? 'textarea' : 'input');
  if(!multiline) input.type = 'text';
  input.value = obj[key] || '';
  input.placeholder = placeholder || '';
  input.oninput = function(){ obj[key] = input.value; };
  input.onblur = function(){ saveFn(); };
  wrap.appendChild(input);
  return wrap;
}

/* ---------------- Treatment (Four Pages exercise) ---------------- */
function renderTreatment(content, proj){
  content.innerHTML = '';
  if(!proj.treatment) proj.treatment = {};
  var t = proj.treatment;

  var toolbar = document.createElement('div');
  toolbar.className = 'board-toolbar';
  toolbar.innerHTML = '<div class="hint">Field\'s “kick in the ass” exercise: a short prose treatment, written before a single scene, that forces the whole story into focus. The lengths below are guides, not limits.</div>';
  content.appendChild(toolbar);

  function save(){ store.update(proj.id, {treatment: t}); }
  function fld(key, label, note, multiline){
    var wrap = makeField(t, key, label, '', save, multiline !== false);
    if(note){
      var n = document.createElement('div');
      n.className = 'treatment-note';
      n.textContent = note;
      wrap.insertBefore(n, wrap.querySelector('textarea, input'));
    }
    return wrap;
  }

  var g1 = document.createElement('div');
  g1.className = 'field-grid full';
  g1.appendChild(fld('opening', 'Opening', '~half a page — a dramatic recreation of your first scene, not a summary of it.'));
  content.appendChild(g1);

  var g2 = document.createElement('div');
  g2.className = 'field-grid full';
  g2.appendChild(fld('act1Synopsis', 'Act I — narrative synopsis', '~half a page.'));
  g2.appendChild(fld('plotPoint1', 'Plot Point I', '~half a page — the incident that spins the story into Act II.'));
  content.appendChild(g2);

  var sub = document.createElement('div');
  sub.className = 'subhead';
  sub.textContent = 'Act II obstacles';
  content.appendChild(sub);
  var obGrid = document.createElement('div');
  obGrid.className = 'obstacle-grid';
  for(var i=1;i<=4;i++){
    (function(n){
      obGrid.appendChild(makeField(t, 'obstacle'+n, 'Obstacle ' + n, 'A concrete thing standing between your character and their need', save));
    })(i);
  }
  content.appendChild(obGrid);

  var g3 = document.createElement('div');
  g3.className = 'field-grid full';
  g3.appendChild(fld('act2Synopsis', 'Act II — narrative synopsis', '~1 page.'));
  g3.appendChild(fld('plotPoint2', 'Plot Point II', '~half a page — the incident that spins the story into Act III.'));
  g3.appendChild(fld('act3Synopsis', 'Act III — synopsis', '~half a page.'));
  g3.appendChild(fld('ending', 'Ending', '~half a page — how it resolves.'));
  content.appendChild(g3);
}

function renderCharacters(content, proj){

  var toolbar = document.createElement('div');

  toolbar.innerHTML = '<div class="hint">Dramatic need drives every choice a character makes; the arc tracks how that changes across the story.</div>';
  content.appendChild(toolbar);

  var list = document.createElement('div');

  function save(){ store.update(proj.id, {characters: proj.characters}); }

  proj.characters.forEach(function(ch){
    var card = document.createElement('div');

    var head = document.createElement('div');
    head.className = 'char-head';

    nameInput.type = 'text';
    nameInput.value = ch.name || '';
    nameInput.placeholder = 'Character name';

    nameInput.onclick = function(e){ e.stopPropagation(); };

/* ---------------- Sequences ---------------- */
function renderSequences(content, proj){
  content.innerHTML = '';
  if(!proj.sequences) proj.sequences = [];

  var toolbar = document.createElement('div');
  toolbar.className = 'board-toolbar';
  toolbar.innerHTML = '<div class="hint">Roughly 8–10 sequences make a feature — each is its own mini-story with a beginning, middle, and end. Assign cards to a sequence from the Cards tab.</div>';
  content.appendChild(toolbar);

  var list = document.createElement('div');
  list.className = 'seq-list';

  function save(){ store.update(proj.id, {sequences: proj.sequences}); }
  function cardsFor(seqId){ return (proj.cards||[]).filter(function(c){ return c.sequenceId === seqId; }); }
  var COL_LABEL = {act1:'Act I', act2a:'Act II-A', act2b:'Act II-B', act3:'Act III'};

  proj.sequences.forEach(function(seq, i){
    var row = document.createElement('div');
    row.className = 'seq-row';

    var order = document.createElement('div');
    order.className = 'seq-order mono';
    order.textContent = i+1;

    var fields = document.createElement('div');
    fields.className = 'seq-fields';
    var nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.className = 'seq-name';
    nameInput.value = seq.name || '';
    nameInput.placeholder = 'Sequence name (e.g. “The Chase”)';
    nameInput.oninput = function(){ seq.name = nameInput.value; };
    nameInput.onblur = save;
    var qInput = document.createElement('input');
    qInput.type = 'text';
    qInput.value = seq.question || '';
    qInput.placeholder = 'One-line dramatic question — what has to be resolved by the end of this sequence?';
    qInput.oninput = function(){ seq.question = qInput.value; };
    qInput.onblur = save;
    var linkedCards = cardsFor(seq.id);
    var toggle = document.createElement('button');
    toggle.className = 'seq-toggle';
    toggle.type = 'button';
    toggle.textContent = linkedCards.length + ' card' + (linkedCards.length === 1 ? '' : 's') + (linkedCards.length ? ' ▾' : '');
    var cardsWrap = document.createElement('div');
    cardsWrap.className = 'seq-cards';
    cardsWrap.style.display = 'none';
    linkedCards.forEach(function(c){
      var item = document.createElement('div');
      item.className = 'seq-card-item';
      item.innerHTML = '<span class="col-tag mono"></span><span></span>';
      item.querySelector('.col-tag').textContent = COL_LABEL[c.col] || c.col;
      item.querySelector('span:last-child').textContent = c.text || '(untitled card)';
      item.style.cursor = 'pointer';
      item.title = 'Open in Cards';
      item.onclick = function(){ state.tab = 'cards'; renderAll(); };
      cardsWrap.appendChild(item);
    });
    toggle.onclick = function(){
      if(!linkedCards.length) return;
      var open = cardsWrap.style.display !== 'none';
      cardsWrap.style.display = open ? 'none' : 'flex';
      toggle.textContent = linkedCards.length + ' card' + (linkedCards.length === 1 ? '' : 's') + (open ? ' ▾' : ' ▴');
    };
    fields.appendChild(nameInput);
    fields.appendChild(qInput);
    fields.appendChild(toggle);
    fields.appendChild(cardsWrap);

    var actions = document.createElement('div');
    actions.className = 'seq-actions';
    var up = document.createElement('button');
    up.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m18 15-6-6-6 6"/></svg>';
    up.disabled = (i === 0);
    up.onclick = function(){
      proj.sequences.splice(i-1, 0, proj.sequences.splice(i,1)[0]);
      save(); renderAll();
    };
    var down = document.createElement('button');
    down.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>';
    down.disabled = (i === proj.sequences.length - 1);
    down.onclick = function(){
      proj.sequences.splice(i+1, 0, proj.sequences.splice(i,1)[0]);
      save(); renderAll();
    };
    var del = document.createElement('button');
    del.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    del.onclick = function(){
      proj.sequences = proj.sequences.filter(function(s){ return s.id !== seq.id; });
      (proj.cards||[]).forEach(function(c){ if(c.sequenceId === seq.id) c.sequenceId = ''; });
      store.update(proj.id, {sequences: proj.sequences, cards: proj.cards});
      renderAll();
    };
    actions.appendChild(up); actions.appendChild(down); actions.appendChild(del);

    row.appendChild(order);
    row.appendChild(fields);
    row.appendChild(actions);
    list.appendChild(row);
  });

  content.appendChild(list);

  var addBtn = document.createElement('button');
  addBtn.className = 'add-row-btn';
  addBtn.textContent = '+ Add sequence';
  addBtn.onclick = function(){
    proj.sequences.push({id:cid(), name:'', question:''});
    save(); renderAll();
  };
  content.appendChild(addBtn);
}

/* ---------------- Graph ---------------- */
var COL_LABEL_GRAPH = {act1:'Act I', act2a:'Act II-A', act2b:'Act II-B', act3:'Act III'};

function renderGraphView(content, proj){
  content.innerHTML = '';

  var toolbar = document.createElement('div');
  toolbar.className = 'board-toolbar';
  toolbar.innerHTML = '<div class="hint">Sequences, cards, and characters, connected by what actually links them in your data — not everything is linked to everything. Click any node to jump to it.</div>';
  content.appendChild(toolbar);

  if(typeof d3 === 'undefined'){
    var offline = document.createElement('div');
    offline.className = 'critic-empty';
    offline.textContent = 'The graph library didn\'t load (needs internet the first time). Everything else in the app still works offline.';
    content.appendChild(offline);
    return;
  }

  var nodes = [];
  var links = [];
  var idIndex = {};
  function addNode(id, type, label, extra){
    idIndex[id] = nodes.length;
    nodes.push(Object.assign({id:id, type:type, label:label}, extra||{}));
  }

  (proj.sequences||[]).forEach(function(s){ addNode('seq:'+s.id, 'sequence', s.name || 'Untitled sequence'); });
  (proj.characters||[]).forEach(function(c){ addNode('char:'+c.id, 'character', c.name || 'Unnamed'); });
  (proj.cards||[]).forEach(function(c){
    addNode('card:'+c.id, 'card', (c.text||'Untitled card'), {tag:c.tag, col:c.col});
  });

  (proj.cards||[]).forEach(function(c){
    if(c.sequenceId && idIndex['seq:'+c.sequenceId] !== undefined){
      links.push({source:'card:'+c.id, target:'seq:'+c.sequenceId});
    }
    (c.characterIds||[]).forEach(function(chId){
      if(idIndex['char:'+chId] !== undefined){
        links.push({source:'card:'+c.id, target:'char:'+chId});
      }
    });
  });

  if(nodes.length === 0){
    var empty = document.createElement('div');
    empty.className = 'critic-empty';
    empty.textContent = 'Add some cards, characters, or sequences first — the graph draws itself from what you build elsewhere.';
    content.appendChild(empty);
    return;
  }

  var width = 760, height = 520;
  var wrap = document.createElement('div');
  wrap.className = 'graph-wrap';
  content.appendChild(wrap);

  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
  svg.setAttribute('class', 'graph-svg');
  wrap.appendChild(svg);

  var sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(function(d){ return d.id; }).distance(64).strength(0.55))
    .force('charge', d3.forceManyBody().strength(-150))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collide', d3.forceCollide(function(d){ return d.type === 'card' ? 16 : 26; }))
    .stop();
  for(var i=0;i<320;i++) sim.tick();

  // clamp to viewport with margin
  var margin = 40;
  nodes.forEach(function(n){
    n.x = Math.max(margin, Math.min(width-margin, n.x));
    n.y = Math.max(margin, Math.min(height-margin, n.y));
  });

  var ns = svg.namespaceURI;
  var linkGroup = document.createElementNS(ns, 'g');
  links.forEach(function(l){
    var line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', l.source.x); line.setAttribute('y1', l.source.y);
    line.setAttribute('x2', l.target.x); line.setAttribute('y2', l.target.y);
    line.setAttribute('class', 'graph-edge');
    linkGroup.appendChild(line);
  });
  svg.appendChild(linkGroup);

  var nodeGroup = document.createElementNS(ns, 'g');
  nodes.forEach(function(n){
    var g = document.createElementNS(ns, 'g');
    g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')');
    g.setAttribute('class', 'graph-node graph-node-' + n.type + (n.tag ? ' tagged' : ''));
    var circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('r', n.type === 'card' ? 7 : (n.type === 'sequence' ? 15 : 12));
    g.appendChild(circle);
    var text = document.createElementNS(ns, 'text');
    text.setAttribute('y', n.type === 'card' ? 17 : 24);
    var label = n.label.length > 24 ? n.label.slice(0,24) + '…' : n.label;
    text.textContent = label;
    g.appendChild(text);
    var titleEl = document.createElementNS(ns, 'title');
    titleEl.textContent = n.type === 'card' ? (n.label + (n.col ? ' (' + (COL_LABEL_GRAPH[n.col]||n.col) + ')' : '') + (n.tag ? ' — ' + n.tag : '')) : n.label;
    g.appendChild(titleEl);
    g.onclick = function(){
      if(n.type === 'card') state.tab = 'cards';
      else if(n.type === 'character') state.tab = 'characters';
      else if(n.type === 'sequence') state.tab = 'sequences';
      renderAll();
    };
    nodeGroup.appendChild(g);
  });
  svg.appendChild(nodeGroup);

  var legend = document.createElement('div');
  legend.className = 'map-legend graph-legend';
  legend.innerHTML = '<span class="legend-dot seq"></span> Sequence &nbsp; <span class="legend-dot char"></span> Character &nbsp; <span class="legend-dot card"></span> Card &nbsp; <span class="legend-dot card tagged"></span> Card with a checkpoint tag';
  content.appendChild(legend);
}

/* ---------------- Rewrite Checklist ---------------- */
function renderRewrite(content, proj){
  content.innerHTML = '';
  if(!proj.rewriteChecklist) proj.rewriteChecklist = {};
  var totalSteps = REWRITE_CHECKLIST.reduce(function(n,s){ return n + s.steps.length; }, 0);

  var toolbar = document.createElement('div');
  toolbar.className = 'board-toolbar';
  toolbar.innerHTML = '<div class="hint">Run this pass by pass, in order. Unlike the Roadmap, this is meant to be reset and reused on every subsequent draft.</div>';
  var resetBtn = document.createElement('button');
  resetBtn.className = 'add-row-btn';
  resetBtn.style.flex = 'none';
  resetBtn.textContent = 'Reset checklist';
  resetBtn.onclick = function(){
    proj.rewriteChecklist = {};
    store.update(proj.id, {rewriteChecklist: proj.rewriteChecklist});
    renderRewrite(content, proj);
  };
  toolbar.appendChild(resetBtn);
  content.appendChild(toolbar);

  var pw = document.createElement('div');
  pw.className = 'progress-wrap';
  pw.innerHTML = '<div class="progress-track"><div class="progress-fill"></div></div>' +
    '<div class="progress-label"><span class="mono"></span> items done</div>';
  var pwFill = pw.querySelector('.progress-fill');
  var pwCount = pw.querySelector('.mono');
  function refreshTotals(){
    var d = Object.values(proj.rewriteChecklist).filter(Boolean).length;
    pwFill.style.width = Math.round(d/totalSteps*100) + '%';
    pwCount.textContent = d + '/' + totalSteps;
  }
  refreshTotals();
  content.appendChild(pw);

  REWRITE_CHECKLIST.forEach(function(section, pi){
    var doneInSection = section.steps.filter(function(s){ return proj.rewriteChecklist[s.id]; }).length;
    var el = document.createElement('div');
    el.className = 'phase' + (pi === 0 ? ' open' : '');
    el.innerHTML =
      '<div class="phase-head">' +
        '<span class="phase-num">' + (pi+1) + '</span>' +
        '<span class="phase-title">' + esc(section.title) + '</span>' +
        '<span class="phase-count mono">' + doneInSection + '/' + section.steps.length + '</span>' +
        '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>' +
      '</div>' +
      '<div class="phase-steps"></div>';
    el.querySelector('.phase-head').onclick = function(){ el.classList.toggle('open'); };
    var sectionCountEl = el.querySelector('.phase-count');
    var stepsWrap = el.querySelector('.phase-steps');
    section.steps.forEach(function(step){
      var checked = !!proj.rewriteChecklist[step.id];
      var row = document.createElement('div');
      row.className = 'step' + (checked ? ' done' : '');
      var cbId = 'rw_' + step.id;
      row.innerHTML = '<input type="checkbox" id="' + cbId + '" ' + (checked?'checked':'') + '><label for="' + cbId + '"></label>';
      row.querySelector('label').textContent = step.text;
      row.querySelector('input').onchange = function(e){
        proj.rewriteChecklist[step.id] = e.target.checked;
        store.update(proj.id, {rewriteChecklist: proj.rewriteChecklist});
        row.classList.toggle('done', e.target.checked);
        var nowDone = section.steps.filter(function(s){ return proj.rewriteChecklist[s.id]; }).length;
        sectionCountEl.textContent = nowDone + '/' + section.steps.length;
        refreshTotals();
      };
      stepsWrap.appendChild(row);
    });
    content.appendChild(el);
  });
}

/* ---------------- Submission & Protection ---------------- */
var SUBMISSION_STATUS = ['Sent', 'Passed', 'Requested More', 'Optioned', 'No Response'];

function renderSubmission(content, proj){
  content.innerHTML = '';
  if(!proj.protection) proj.protection = {};
  if(!proj.submissions) proj.submissions = [];
  var prot = proj.protection;

  var toolbar = document.createElement('div');
  toolbar.className = 'board-toolbar';
  toolbar.innerHTML = '<div class="hint">Protect the script before it leaves your hands, then keep a record of where it went.</div>';
  content.appendChild(toolbar);

  function saveProt(){ store.update(proj.id, {protection: prot}); }
  function saveSubs(){ store.update(proj.id, {submissions: proj.submissions}); }

  var sub = document.createElement('div');
  sub.className = 'subhead';
  sub.textContent = 'Protection checklist';
  content.appendChild(sub);

  var protList = document.createElement('div');
  protList.className = 'protection-list';
  [
    {key:'backedUp', label:'Backed up the script (more than one place)'},
    {key:'registered', label:'Registered with the WGA or the U.S. Copyright Office'},
    {key:'copiesMade', label:'Made physical/PDF copies ready to send'}
  ].forEach(function(item){
    var row = document.createElement('div');
    row.className = 'protection-row';
    var cbId = 'prot_' + item.key;
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.id = cbId;
    cb.checked = !!prot[item.key];
    cb.onchange = function(){ prot[item.key] = cb.checked; saveProt(); };
    var lab = document.createElement('label');
    lab.setAttribute('for', cbId);
    lab.textContent = item.label;
    lab.style.fontSize = '13px';
    row.appendChild(cb);
    row.appendChild(lab);
    protList.appendChild(row);
  });
  content.appendChild(protList);

  var sub2 = document.createElement('div');
  sub2.className = 'subhead';
  sub2.textContent = 'Submission log';
  content.appendChild(sub2);

  proj.submissions.forEach(function(s){
    var row = document.createElement('div');
    row.className = 'sub-row';
    var fields = document.createElement('div');
    fields.className = 'sub-fields';

    var nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.placeholder = 'Agent / company';
    nameInput.value = s.name || '';
    nameInput.oninput = function(){ s.name = nameInput.value; };
    nameInput.onblur = saveSubs;

    var dateInput = document.createElement('input');
    dateInput.type = 'text'; dateInput.placeholder = 'Date sent';
    dateInput.value = s.dateSent || '';
    dateInput.oninput = function(){ s.dateSent = dateInput.value; };
    dateInput.onblur = saveSubs;

    var statusSel = document.createElement('select');
    var blankOpt = document.createElement('option');
    blankOpt.value=''; blankOpt.textContent='Status';
    statusSel.appendChild(blankOpt);
    SUBMISSION_STATUS.forEach(function(st){
      var opt = document.createElement('option');
      opt.value = st; opt.textContent = st;
      if(s.status === st) opt.selected = true;
      statusSel.appendChild(opt);
    });
    statusSel.onchange = function(){ s.status = statusSel.value; saveSubs(); };

    var notesInput = document.createElement('input');
    notesInput.type = 'text'; notesInput.placeholder = 'Notes (option terms, etc.)';
    notesInput.value = s.notes || '';
    notesInput.oninput = function(){ s.notes = notesInput.value; };
    notesInput.onblur = saveSubs;

    fields.appendChild(nameInput);
    fields.appendChild(dateInput);
    fields.appendChild(statusSel);
    fields.appendChild(notesInput);

    var del = document.createElement('button');
    del.className = 'card-del';
    del.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    del.onclick = function(){
      proj.submissions = proj.submissions.filter(function(x){ return x.id !== s.id; });
      saveSubs();
      renderSubmission(content, proj);
    };

    row.appendChild(fields);
    row.appendChild(del);
    content.appendChild(row);
  });

  var addBtn = document.createElement('button');
  addBtn.className = 'add-row-btn';
  addBtn.textContent = '+ Log a submission';
  addBtn.onclick = function(){
    proj.submissions.push({id:cid(), name:'', dateSent:'', status:'', notes:''});
    saveSubs();
    renderSubmission(content, proj);
  };
  content.appendChild(addBtn);
}

var dragCardId = null;

function renderCards(content, proj){
  content.innerHTML = '';
  if(!proj.cards) proj.cards = [];

  var toolbar = document.createElement('div');
  toolbar.className = 'board-toolbar';
  toolbar.innerHTML = '<div class="hint">Drag cards between acts. Use the tag on each card to mark checkpoints (Plot Points, Pinches, Mid-Point).</div>';
  content.appendChild(toolbar);

  var cols = document.createElement('div');
  cols.className = 'columns';

  COLUMNS.forEach(function(col){
    var colCards = proj.cards.filter(function(c){ return c.col === col.id; });
    var colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.dataset.col = col.id;
    colEl.innerHTML = '<div class="column-head"><span class="column-title"></span><span class="column-count mono">' + colCards.length + '</span></div>';
    colEl.querySelector('.column-title').textContent = col.title;

    colCards.forEach(function(card){ colEl.appendChild(renderCard(card, proj)); });

    var addBtn = document.createElement('button');
    addBtn.className = 'add-card-btn';
    addBtn.textContent = '+ Add card';
    addBtn.onclick = function(){
      proj.cards.push({id:cid(), col:col.id, text:'', tag:''});
      store.update(proj.id, {cards: proj.cards});
      renderAll();
    };
    colEl.appendChild(addBtn);

    colEl.ondragover = function(e){ e.preventDefault(); };
    colEl.ondrop = function(e){
      e.preventDefault();
      if(!dragCardId) return;
      var card = proj.cards.find(function(c){ return c.id === dragCardId; });
      if(card){ card.col = col.id; store.update(proj.id, {cards: proj.cards}); renderAll(); }
    };
    cols.appendChild(colEl);
  });
  content.appendChild(cols);
}

function renderCard(card, proj){
  var el = document.createElement('div');
  el.className = 'idx-card';
  el.draggable = true;
  el.ondragstart = function(){ dragCardId = card.id; el.classList.add('dragging'); };
  el.ondragend = function(){ el.classList.remove('dragging'); };

  var ta = document.createElement('textarea');
  ta.value = card.text;
  ta.placeholder = 'What happens in this scene?';
  ta.oninput = function(){ card.text = ta.value; };
  ta.onblur = function(){ store.update(proj.id, {cards: proj.cards}); };
  el.appendChild(ta);

  var foot = document.createElement('div');
  foot.className = 'card-foot';
  var sel = document.createElement('select');
  sel.className = 'tag-select' + (card.tag ? ' tagged' : '');
  TAGS.forEach(function(t){
    var opt = document.createElement('option');
    opt.value = t; opt.textContent = t || 'No tag';
    if(t === card.tag) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = function(){
    card.tag = sel.value;
    sel.className = 'tag-select' + (card.tag ? ' tagged' : '');
    store.update(proj.id, {cards: proj.cards});
  };
  var del = document.createElement('button');
  del.className = 'card-del';
  del.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  del.onclick = function(){
    proj.cards = proj.cards.filter(function(c){ return c.id !== card.id; });
    store.update(proj.id, {cards: proj.cards});
    renderAll();
  };
  foot.appendChild(sel);

  if(proj.sequences && proj.sequences.length){
    var seqSel = document.createElement('select');
    seqSel.className = 'seq-select';
    var noneOpt = document.createElement('option');
    noneOpt.value = ''; noneOpt.textContent = 'No sequence';
    seqSel.appendChild(noneOpt);
    proj.sequences.forEach(function(s, i){
      var opt = document.createElement('option');
      opt.value = s.id; opt.textContent = (i+1) + '. ' + (s.name || 'Untitled');
      if(card.sequenceId === s.id) opt.selected = true;
      seqSel.appendChild(opt);
    });
    seqSel.onchange = function(){
      card.sequenceId = seqSel.value;
      store.update(proj.id, {cards: proj.cards});
    };
    foot.appendChild(seqSel);
  }

  foot.appendChild(del);
  el.appendChild(foot);

  var toggle = document.createElement('button');
  toggle.className = 'scene-toggle';
  toggle.textContent = el.classList.contains('expanded') ? '– scene details' : '+ scene details';
  toggle.onclick = function(){
    el.classList.toggle('expanded');
    toggle.textContent = el.classList.contains('expanded') ? '– scene details' : '+ scene details';
  };
  el.appendChild(toggle);

  var details = document.createElement('div');
  details.className = 'scene-details';

  var purposeLabel = document.createElement('label');
  purposeLabel.textContent = 'Purpose';
  var purposeSel = document.createElement('select');
  SCENE_PURPOSES.forEach(function(p){
    var opt = document.createElement('option');
    opt.value = p; opt.textContent = p || 'Not set';
    if(card.purpose === p) opt.selected = true;
    purposeSel.appendChild(opt);
  });
  purposeSel.onchange = function(){ card.purpose = purposeSel.value; store.update(proj.id, {cards: proj.cards}); };

  var conflictLabel = document.createElement('label');
  conflictLabel.textContent = 'Conflict / obstacle';
  var conflictTa = document.createElement('textarea');
  conflictTa.value = card.conflict || '';
  conflictTa.placeholder = 'What is this character up against here?';
  conflictTa.oninput = function(){ card.conflict = conflictTa.value; };
  conflictTa.onblur = function(){ store.update(proj.id, {cards: proj.cards}); };

  var entryLabel = document.createElement('label');
  entryLabel.textContent = 'Enter late, leave early';
  var entryTa = document.createElement('textarea');
  entryTa.value = card.entryExit || '';
  entryTa.placeholder = 'Where does this scene actually start and end?';
  entryTa.oninput = function(){ card.entryExit = entryTa.value; };
  entryTa.onblur = function(){ store.update(proj.id, {cards: proj.cards}); };

  details.appendChild(purposeLabel); details.appendChild(purposeSel);
  details.appendChild(conflictLabel); details.appendChild(conflictTa);
  details.appendChild(entryLabel); details.appendChild(entryTa);

  if(proj.characters && proj.characters.length){
    if(!card.characterIds) card.characterIds = [];
    var charLabel = document.createElement('label');
    charLabel.textContent = 'Characters in this scene';
    var charChips = document.createElement('div');
    charChips.className = 'card-char-chips';
    proj.characters.forEach(function(ch){
      var chip = document.createElement('button');
      chip.type = 'button';
      var on = card.characterIds.indexOf(ch.id) !== -1;
      chip.className = 'char-chip' + (on ? ' on' : '');
      chip.textContent = ch.name || 'Unnamed';
      chip.onclick = function(){
        var i = card.characterIds.indexOf(ch.id);
        if(i === -1) card.characterIds.push(ch.id); else card.characterIds.splice(i, 1);
        chip.classList.toggle('on');
        store.update(proj.id, {cards: proj.cards});
      };
      charChips.appendChild(chip);
    });
    details.appendChild(charLabel);
    details.appendChild(charChips);
  }

  el.appendChild(details);

  return el;
}

/* ---------------- Critic's Page ---------------- */
function renderCritic(content, proj){
  content.innerHTML = '';
  if(!proj.criticLog) proj.criticLog = [];

  var toolbar = document.createElement('div');
  toolbar.className = 'board-toolbar';
  toolbar.innerHTML = '<div class="hint">When the self-critical voice pipes up while you\'re drafting, dump it here instead of stopping to argue with it. Reread this in a few days — you\'ll usually find it says the same three or four things regardless of what you actually wrote.</div>';
  content.appendChild(toolbar);

  var form = document.createElement('div');
  form.className = 'critic-form';
  var ta = document.createElement('textarea');
  ta.placeholder = 'What is the critic saying right now?';
  ta.rows = 2;
  var addBtn = document.createElement('button');
  addBtn.textContent = 'Add entry';
  addBtn.onclick = function(){
    var v = ta.value.trim();
    if(!v) return;
    var entry = {id:cid(), date:new Date().toISOString().slice(0,10), text:v};
    proj.criticLog.unshift(entry);
    store.update(proj.id, {criticLog: proj.criticLog});
    ta.value = '';
    renderCritic(content, proj);
  };
  form.appendChild(ta);
  form.appendChild(addBtn);
  content.appendChild(form);

  var list = document.createElement('div');
  list.className = 'critic-list';
  if(proj.criticLog.length === 0){
    var empty = document.createElement('div');
    empty.className = 'critic-empty';
    empty.textContent = 'No entries yet — this fills up on its own once you start drafting.';
    list.appendChild(empty);
  }
  proj.criticLog.forEach(function(entry){
    var row = document.createElement('div');
    row.className = 'critic-entry';
    row.innerHTML = '<div class="critic-date mono"></div><div class="critic-text"></div>';
    row.querySelector('.critic-date').textContent = entry.date;
    row.querySelector('.critic-text').textContent = entry.text;
    var del = document.createElement('button');
    del.className = 'critic-del';
    del.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    del.onclick = function(){
      proj.criticLog = proj.criticLog.filter(function(e){ return e.id !== entry.id; });
      store.update(proj.id, {criticLog: proj.criticLog});
      renderCritic(content, proj);
    };
    row.appendChild(del);
    list.appendChild(row);
  });
  content.appendChild(list);
}

function renderGlossary(content){
  content.innerHTML = '';
  var controls = document.createElement('div');
  controls.className = 'glossary-controls';
  var search = document.createElement('div');
  search.className = 'search-box';
  search.innerHTML = '<input type="text" placeholder="Search terms… e.g. Mid-Point, dramatic need, playing against the grain">';
  var input = search.querySelector('input');
  input.value = state.glossQuery;
  input.oninput = function(){ state.glossQuery = input.value; renderGlossList(); };
  controls.appendChild(search);

  var books = ['All', 'Screenplay', "Screenwriter's Workbook", 'Four Screenplays'];
  var chips = document.createElement('div');
  chips.className = 'chip-row';
  books.forEach(function(b){
    var chip = document.createElement('button');
    chip.className = 'chip' + (state.glossBook === b ? ' active' : '');
    chip.textContent = b;
    chip.onclick = function(){ state.glossBook = b; renderGlossary(content); };
    chips.appendChild(chip);
  });
  controls.appendChild(chips);
  content.appendChild(controls);

  var countEl = document.createElement('div');
  countEl.className = 'gloss-count';
  content.appendChild(countEl);

  var grid = document.createElement('div');
  grid.className = 'gloss-grid';
  content.appendChild(grid);

  function renderGlossList(){
    var q = state.glossQuery.trim().toLowerCase();
    var filtered = GLOSSARY.filter(function(g){
      if(state.glossBook !== 'All' && g.book !== state.glossBook) return false;
      if(!q) return true;
      return (g.term + ' ' + g.definition).toLowerCase().indexOf(q) !== -1;
    });
    countEl.textContent = filtered.length + ' of ' + GLOSSARY.length + ' terms';
    grid.innerHTML = '';
    if(filtered.length === 0){
      grid.innerHTML = '<div class="hint" style="color:var(--muted); grid-column:1/-1;">No matching terms.</div>';
      return;
    }
    filtered.forEach(function(g){
      var pillClass = g.book === 'Screenplay' ? 'sp' : (g.book === "Screenwriter's Workbook" ? 'wb' : 'fs');
      var e = document.createElement('div');
      e.className = 'gloss-entry';
      e.innerHTML = '<div class="gloss-term"></div><div class="gloss-def"></div><div class="gloss-src"><span class="book-pill ' + pillClass + '"></span><span class="chnum"></span></div>';
      e.querySelector('.gloss-term').textContent = g.term;
      e.querySelector('.gloss-def').textContent = g.definition;
      e.querySelector('.book-pill').textContent = g.book;
      e.querySelector('.chnum').textContent = 'Ch. ' + g.chapterNum + ' — ' + (g.chapter || '');
      var linkTab = findGlossaryLink(g.term);
      if(linkTab && TAB_META[linkTab]){
        var chip = document.createElement('button');
        chip.className = 'gloss-link';
        chip.type = 'button';
        chip.textContent = 'Open in ' + TAB_META[linkTab].title;
        chip.onclick = function(){ state.tab = linkTab; renderAll(); };
        e.appendChild(chip);
      }
      grid.appendChild(e);
    });
  }
  renderGlossList();
}

function createProject(){
  store.create({name: 'Untitled Screenplay', roadmap: {}, cards: [], characters: [], sequences: [], rewriteChecklist: {}}).then(function(proj){
    state.projects.push(proj);
    state.currentId = proj.id;
    renderAll();
    var row = document.querySelector('.project-row.active .project-btn');
    if(row) startRename(proj, row);
  });
}

/* ---------------- Wire up ---------------- */
document.querySelectorAll('.nav-btn').forEach(function(b){
  b.onclick = function(){ state.tab = b.dataset.tab; renderAll(); };
});
document.getElementById('newProjectBtn').onclick = createProject;

document.getElementById('exportBtn').onclick = function(){
  var data = JSON.stringify({exportedAt: new Date().toISOString(), projects: state.projects}, null, 2);
  var blob = new Blob([data], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'screenwriting-desk-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

document.getElementById('importBtn').onclick = function(){
  document.getElementById('importFile').click();
};
document.getElementById('importFile').onchange = function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(err){ alert('That file isn\'t valid JSON.'); return; }
    var incoming = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.projects) ? parsed.projects : [parsed]);
    if(!incoming.length){ alert('No projects found in that file.'); return; }
    Promise.all(incoming.map(function(p){
      var copy = Object.assign({}, p);
      delete copy.id;
      return store.create(copy);
    })).then(function(created){
      created.forEach(function(proj){ state.projects.push(proj); });
      state.currentId = created[created.length - 1].id;
      renderAll();
      alert('Imported ' + created.length + ' project' + (created.length === 1 ? '' : 's') + '.');
    });
  };
  reader.readAsText(file);
  e.target.value = '';
};

(async function init(){
  await store.init();
  state.projects = await store.fetchAll();
  if(state.projects.length === 0){
    var proj = await store.create({name:'Example Project', roadmap:{s00:true, s01:true}, cards: exampleCards(), characters: [], sequences: [], rewriteChecklist: {}});
    state.projects.push(proj);
    state.currentId = proj.id;
  } else if(!state.currentId){
    state.currentId = state.projects[0].id;
  }
  renderAll();
})();

})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').then(function(reg){
      // Browsers only check for a new service-worker.js lazily; force a check on
      // every load so an update (like a new tab/feature) is picked up promptly
      // instead of waiting on the browser's own schedule.
      reg.update().catch(function(){});
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(refreshing) return;
        refreshing = true;
        location.reload();
      });
    }).catch(function(e){ console.warn('Service worker registration failed:', e); });
  });
}
</script>
