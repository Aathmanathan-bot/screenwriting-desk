<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screenwriting Desk</title>
<meta name="description" content="A personal screenwriting workspace built from Syd Field's books.">
<meta name="theme-color" content="#B14A2A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EFECE4; --surface:#FFFFFF; --surface-2:#F7F4EC; --ink:#221F1A; --muted:#6E6A5E;
  --accent:#B14A2A; --accent-ink:#FFFFFF; --accent-2:#3C6E58; --border:#DDD6C4;
  --card-bg:#FFFDF7; --card-shadow:rgba(40,30,10,0.18);
  --board-felt:#2F4A3B; --board-felt-2:#274031; --pin:#B14A2A; --danger:#A3402B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17140F; --surface:#201C15; --surface-2:#241F17; --ink:#ECE6D8; --muted:#A79D89;
    --accent:#E2794C; --accent-ink:#171310; --accent-2:#5FA98A; --border:#3A3325;
    --card-bg:#2A2419; --card-shadow:rgba(0,0,0,0.55);
    --board-felt:#1D2E24; --board-felt-2:#16241C; --pin:#E2794C; --danger:#E2794C;
  }
}
:root[data-theme="dark"]{
  --bg:#17140F; --surface:#201C15; --surface-2:#241F17; --ink:#ECE6D8; --muted:#A79D89;
  --accent:#E2794C; --accent-ink:#171310; --accent-2:#5FA98A; --border:#3A3325;
  --card-bg:#2A2419; --card-shadow:rgba(0,0,0,0.55);
  --board-felt:#1D2E24; --board-felt-2:#16241C; --pin:#E2794C; --danger:#E2794C;
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; font-size:14px; line-height:1.5;}
h1,h2,h3,.display{font-family:"Fraunces", Georgia, serif; text-wrap:balance;}
.mono{font-family:"IBM Plex Mono", ui-monospace, monospace;}
button{font-family:inherit; cursor:pointer;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

.app{display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{width:250px; flex:none; background:var(--surface-2); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:18px 14px; gap:18px;}
.brand{display:flex; flex-direction:column; gap:2px; padding:0 4px;}
.brand .mark{font-size:20px; font-weight:600; letter-spacing:-0.01em;}
.brand .sub{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em;}

.section-label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding:0 4px; margin-bottom:6px;}
.projects{display:flex; flex-direction:column; gap:3px;}
.project-row{display:flex; align-items:center; gap:6px;}
.project-btn{flex:1; text-align:left; background:transparent; border:1px solid transparent; border-radius:8px; padding:8px 10px; color:var(--ink); font-size:13.5px; display:flex; flex-direction:column; gap:2px; min-width:0;}
.project-btn .name{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500;}
.project-btn .meta{font-size:10.5px; color:var(--muted);}
.project-btn:hover{background:var(--surface);}
.project-row.active .project-btn{background:var(--surface); border-color:var(--border); box-shadow:0 1px 0 var(--card-shadow) inset;}
.icon-btn{border:none; background:transparent; color:var(--muted); border-radius:6px; padding:5px; display:flex; align-items:center; justify-content:center;}
.icon-btn:hover{background:var(--surface); color:var(--danger);}
.icon-btn.armed{background:var(--danger); color:#fff; font-size:10.5px; font-weight:600; padding:5px 8px; white-space:nowrap;}
.icon-btn.armed:hover{background:var(--danger); color:#fff;}
.new-project{margin-top:2px; display:flex; align-items:center; gap:6px; padding:8px 10px; border-radius:8px; border:1px dashed var(--border); color:var(--muted); font-size:13px; background:transparent;}
.new-project:hover{color:var(--accent); border-color:var(--accent);}
.backup-row{display:flex; gap:6px; margin-top:6px;}
.backup-btn{flex:1; border:none; background:transparent; color:var(--muted); font-size:11px; padding:5px 4px; border-radius:6px; text-decoration:underline; text-decoration-color:transparent;}
.backup-btn:hover{color:var(--accent); text-decoration-color:var(--accent);}

.nav{display:flex; flex-direction:column; gap:2px; margin-top:auto;}
.nav-btn{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; border:none; background:transparent; color:var(--muted); font-size:13.5px; font-weight:500; text-align:left;}
.nav-btn svg{width:16px; height:16px; flex:none;}
.nav-btn.active{background:var(--accent); color:var(--accent-ink);}
.nav-btn:not(.active):hover{background:var(--surface); color:var(--ink);}

/* ---------- Main ---------- */
.main{flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; overflow:hidden;}
.topbar{flex:none; padding:20px 32px 14px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; justify-content:space-between; gap:16px;}
.topbar h1{font-size:22px; font-weight:600; margin:0;}
.topbar .desc{font-size:12.5px; color:var(--muted); margin-top:2px;}
.content{flex:1; overflow-y:auto; padding:26px 32px 60px;}

.empty-state{max-width:420px; margin:60px auto; text-align:center; color:var(--muted);}
.empty-state .display{font-size:20px; color:var(--ink); margin-bottom:8px;}
.empty-state button{margin-top:16px; background:var(--accent); color:var(--accent-ink); border:none; padding:10px 18px; border-radius:8px; font-size:13.5px; font-weight:500;}

/* ---------- Roadmap ---------- */
.progress-wrap{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
.progress-track{flex:1; height:8px; border-radius:5px; background:var(--border); overflow:hidden;}
.progress-fill{height:100%; background:var(--accent-2); border-radius:5px; transition:width .25s ease;}
.progress-label{font-size:12px; color:var(--muted); white-space:nowrap;}
.progress-label .mono{color:var(--ink); font-weight:500;}

.phase{border:1px solid var(--border); border-radius:12px; background:var(--surface); margin-bottom:14px; overflow:hidden;}
.phase-head{display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; user-select:none;}
.phase-num{font-family:"IBM Plex Mono"; font-size:11px; color:var(--surface); background:var(--accent-2); width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none;}
.phase-title{font-weight:600; font-size:14.5px; flex:1;}
.phase-count{font-size:11.5px; color:var(--muted); font-family:"IBM Plex Mono";}
.chevron{width:14px; height:14px; color:var(--muted); transition:transform .15s ease; flex:none;}
.phase.open .chevron{transform:rotate(90deg);}
.phase-steps{display:none; padding:0 16px 14px 50px; flex-direction:column; gap:10px;}
.phase.open .phase-steps{display:flex;}
.step{display:flex; align-items:flex-start; gap:10px;}
.step input[type=checkbox]{margin-top:3px; width:15px; height:15px; accent-color:var(--accent-2); flex:none;}
.step label{font-size:13.5px; line-height:1.5; cursor:pointer;}
.step.done label{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--border);}
.checkpoint-strip{margin-top:26px; padding:16px 18px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); font-size:12.5px; color:var(--muted);}
.checkpoint-strip .display{color:var(--ink); font-size:13.5px; margin-bottom:6px;}
.checkpoint-strip .chain{font-family:"IBM Plex Mono"; color:var(--ink); font-size:12px; line-height:1.9;}

/* ---------- Cards / corkboard ---------- */
.board-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px;}
.board-toolbar .hint{font-size:12px; color:var(--muted);}
.columns{display:grid; grid-template-columns:repeat(4,minmax(210px,1fr)); gap:16px; align-items:start;}
.column{background:var(--board-felt); background-image:radial-gradient(var(--board-felt-2) 1px, transparent 1px); background-size:14px 14px; border-radius:14px; padding:14px 12px 60px; min-height:420px; display:flex; flex-direction:column; gap:12px;}
.column-head{display:flex; align-items:center; justify-content:space-between; padding:2px 4px 6px;}
.column-title{color:#F3EFE3; font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:.05em;}
.column-count{color:#C9C2AA; font-family:"IBM Plex Mono"; font-size:11px;}
.add-card-btn{width:100%; border:1.5px dashed rgba(243,239,227,0.35); color:#DCD6C2; background:transparent; border-radius:8px; padding:8px; font-size:12px;}
.add-card-btn:hover{border-color:#F3EFE3; color:#F3EFE3;}

.idx-card{background:var(--card-bg); border-radius:3px; padding:12px 12px 10px; box-shadow:0 3px 8px var(--card-shadow), 0 1px 0 rgba(255,255,255,0.4) inset; position:relative; cursor:grab; border:1px solid rgba(0,0,0,0.06);}
.idx-card::before{content:""; position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:11px; height:11px; border-radius:50%; background:var(--pin); box-shadow:0 2px 3px rgba(0,0,0,0.35);}
.idx-card.dragging{opacity:.4;}
.idx-card textarea{width:100%; border:none; background:transparent; resize:none; font-family:"IBM Plex Sans"; font-size:12.8px; color:#2b2620; line-height:1.45; padding:0; min-height:44px;}
.idx-card textarea:focus{outline:none;}
.card-foot{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:6px; flex-wrap:wrap;}
.tag-select{font-size:10.5px; font-family:"IBM Plex Mono"; border:none; background:rgba(0,0,0,0.06); color:#2b2620; border-radius:5px; padding:2px 5px;}
.tag-select.tagged{background:var(--accent); color:#fff;}
.card-del{border:none; background:transparent; color:#8b8474; padding:2px;}
.card-del:hover{color:var(--danger);}

/* ---------- Glossary ---------- */
.glossary-controls{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center;}
.search-box{flex:1; min-width:220px; position:relative;}
.search-box input{width:100%; padding:10px 14px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:13.5px;}
.search-box input:focus{outline:2px solid var(--accent); outline-offset:-1px;}
.chip-row{display:flex; gap:6px; flex-wrap:wrap;}
.chip{border:1px solid var(--border); background:var(--surface); color:var(--muted); border-radius:999px; padding:6px 12px; font-size:12px; font-weight:500;}
.chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
.gloss-count{font-size:12px; color:var(--muted); margin-bottom:12px;}
.gloss-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px;}
.gloss-entry{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:13px 14px;}
.gloss-term{font-weight:600; font-size:14px; margin-bottom:4px;}
.gloss-def{font-size:12.8px; color:var(--ink); opacity:.88; line-height:1.5;}
.gloss-src{margin-top:8px; font-size:10.5px; font-family:"IBM Plex Mono"; color:var(--muted);}
.book-pill{display:inline-block; padding:1px 6px; border-radius:4px; margin-right:6px; font-size:10px;}
.book-pill.sp{background:#B14A2A22; color:var(--accent);}
.book-pill.wb{background:#3C6E5822; color:var(--accent-2);}
.book-pill.fs{background:#6E6A5E22; color:var(--muted);}

.rename-input{background:var(--surface); border:1px solid var(--accent); border-radius:6px; padding:6px 8px; font-size:13px; color:var(--ink); width:100%;}

/* ---------- Shared form fields ---------- */
.field{display:flex; flex-direction:column; gap:4px;}
.field .field-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.field input[type=text], .field textarea{background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:7px 9px; font-size:13px; color:var(--ink); font-family:inherit; resize:vertical;}
.field input[type=text]:focus, .field textarea:focus{outline:2px solid var(--accent); outline-offset:-1px;}
.field textarea{min-height:44px; line-height:1.45;}
.add-row-btn{display:flex; align-items:center; gap:6px; padding:10px 14px; border-radius:9px; border:1.5px dashed var(--border); background:transparent; color:var(--muted); font-size:13px; font-weight:500;}
.add-row-btn:hover{color:var(--accent); border-color:var(--accent);}

/* ---------- Characters ---------- */
.char-list{display:flex; flex-direction:column; gap:12px;}
.char-card{border:1px solid var(--border); border-radius:12px; background:var(--surface); overflow:hidden;}
.char-head{display:flex; align-items:center; gap:10px; padding:13px 16px; cursor:pointer; user-select:none;}
.char-head input[type=text]{flex:1; border:none; background:transparent; font-family:"Fraunces"; font-size:15.5px; font-weight:600; color:var(--ink); padding:2px 0;}
.char-head input[type=text]:focus{outline:none; border-bottom:1px solid var(--accent);}
.char-head .need-preview{font-size:11.5px; color:var(--muted); max-width:220px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.char-body{display:none; padding:2px 16px 18px;}
.char-card.open .char-body{display:block;}
.char-card.open .chevron{transform:rotate(90deg);}
.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
.field-grid.full{grid-template-columns:1fr;}
.subhead{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-2); font-weight:700; margin:16px 0 8px;}
.subhead:first-child{margin-top:2px;}
.arc-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
.arc-row .field-label{color:var(--accent);}

/* ---------- Sequences ---------- */
.seq-list{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
.seq-row{display:flex; align-items:flex-start; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px;}
.seq-order{font-family:"IBM Plex Mono"; font-size:12px; color:var(--accent-2); background:var(--surface-2); width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; margin-top:2px;}
.seq-fields{flex:1; display:flex; flex-direction:column; gap:6px; min-width:0;}
.seq-fields input[type=text]{border:none; background:transparent; font-size:13.5px; color:var(--ink); padding:2px 0;}
.seq-fields input.seq-name{font-weight:600; font-size:14px;}
.seq-fields input:focus{outline:none;}
.seq-count{font-size:10.5px; color:var(--muted); font-family:"IBM Plex Mono";}
.seq-actions{display:flex; flex-direction:column; gap:2px;}
.seq-actions button{border:none; background:transparent; color:var(--muted); padding:3px; border-radius:5px;}
.seq-actions button:hover{background:var(--surface-2); color:var(--ink);}
.seq-actions button:disabled{opacity:.3; cursor:default;}
.seq-actions button:disabled:hover{background:transparent;}

/* ---------- Scene details on cards ---------- */
.scene-toggle{width:100%; text-align:left; border:none; background:transparent; color:#8b8474; font-size:10.5px; padding:4px 0 0; font-family:"IBM Plex Mono";}
.scene-toggle:hover{color:#2b2620;}
.scene-details{display:none; flex-direction:column; gap:6px; margin-top:8px; padding-top:8px; border-top:1px dashed rgba(0,0,0,0.12);}
.idx-card.expanded .scene-details{display:flex;}
.scene-details select, .scene-details textarea{width:100%; font-size:11.5px; border:1px solid rgba(0,0,0,0.1); border-radius:5px; padding:4px 6px; background:rgba(255,255,255,0.6); color:#2b2620; font-family:"IBM Plex Sans"; resize:none;}
.scene-details textarea{min-height:32px;}
.scene-details label{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:#8b8474; font-weight:600;}
.seq-select{font-size:10.5px; font-family:"IBM Plex Mono"; border:none; background:rgba(0,0,0,0.06); color:#2b2620; border-radius:5px; padding:2px 5px; max-width:90px;}

/* ---------- Structure Map ---------- */
.map-controls{display:flex; align-items:center; gap:10px; margin-bottom:30px; font-size:12.5px; color:var(--muted);}
.map-controls input{width:64px; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:5px 8px; color:var(--ink); font-family:"IBM Plex Mono"; font-size:12.5px;}
.map-ruler-wrap{position:relative; padding:0 10px; margin-bottom:8px;}
.map-ruler{position:relative; height:6px; background:var(--border); border-radius:4px;}
.map-fill{position:absolute; inset:0; background:linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius:4px;}
.map-marker{position:absolute; top:-9px; width:24px; height:24px; margin-left:-12px; border-radius:50%; background:var(--surface); border:2px solid var(--border); display:flex; align-items:center; justify-content:center;}
.map-marker.filled{border-color:var(--accent); background:var(--accent); box-shadow:0 2px 6px var(--card-shadow);}
.map-marker .dot{width:6px; height:6px; border-radius:50%; background:var(--border);}
.map-marker.filled .dot{background:#fff;}
.map-labels{position:relative; height:290px; padding:0 10px; margin-top:26px;}
.map-tick{position:absolute; top:0; width:140px; margin-left:-70px; text-align:center;}
.map-tick.row1{top:150px;}
.map-tick .name{font-size:11.5px; font-weight:600; color:var(--ink); margin-bottom:2px;}
.map-tick .page{font-size:10px; font-family:"IBM Plex Mono"; color:var(--accent-2); margin-bottom:6px;}
.map-tick .snippet{font-size:11px; color:var(--muted); line-height:1.4;}
.map-tick .snippet.empty{font-style:italic; opacity:.6;}
.map-legend{margin-top:20px; font-size:12px; color:var(--muted); background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 16px;}
.map-marker.filled{cursor:pointer;}
.map-tick.linked .name{cursor:pointer; text-decoration:underline; text-decoration-color:var(--border); text-underline-offset:2px;}
.map-tick.linked .name:hover{color:var(--accent);}

/* ---------- Treatment ---------- */
.treatment-note{font-size:11px; color:var(--accent-2); font-weight:600; margin-top:-2px;}
.obstacle-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}

/* ---------- Critic's Page ---------- */
.critic-form{display:flex; gap:10px; margin-bottom:18px; align-items:flex-start;}
.critic-form textarea{flex:1;}
.critic-form button{flex:none; background:var(--accent); color:var(--accent-ink); border:none; border-radius:9px; padding:0 18px; font-size:13px; font-weight:500;}
.critic-list{display:flex; flex-direction:column; gap:10px;}
.critic-entry{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; display:flex; gap:12px; align-items:flex-start;}
.critic-date{font-family:"IBM Plex Mono"; font-size:11px; color:var(--muted); flex:none; width:78px; padding-top:2px;}
.critic-text{flex:1; font-size:13.5px; line-height:1.5; white-space:pre-wrap;}
.critic-del{flex:none; border:none; background:transparent; color:var(--muted); padding:2px;}
.critic-del:hover{color:var(--danger);}
.critic-empty{color:var(--muted); font-size:13px; font-style:italic;}

/* ---------- Coverage ---------- */
.rating-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
.rating-row{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 12px;}
.rating-row .rname{font-size:12.5px; font-weight:500;}
.rating-row select{font-size:12px; border:1px solid var(--border); border-radius:6px; padding:4px 6px; background:var(--surface-2); color:var(--ink);}
.rec-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.rec-row select{font-size:13px; border:1px solid var(--border); border-radius:7px; padding:7px 10px; background:var(--surface); color:var(--ink); font-weight:600;}

/* ---------- Submission ---------- */
.protection-list{display:flex; flex-direction:column; gap:8px; margin-bottom:22px;}
.protection-row{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:10px 12px;}
.protection-row input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent-2);}
.sub-row{display:flex; align-items:flex-start; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px;}
.sub-fields{flex:1; display:grid; grid-template-columns:1.4fr 0.9fr 0.9fr 1.4fr; gap:8px; min-width:0;}
.sub-fields input[type=text], .sub-fields select{font-size:12.5px; border:1px solid var(--border); border-radius:6px; padding:6px 8px; background:var(--surface-2); color:var(--ink);}

/* ---------- Roadmap jump-links ---------- */
.step-row{display:flex; align-items:flex-start; gap:10px; flex:1;}
.jump-link{flex:none; font-size:10.5px; font-family:"IBM Plex Mono"; color:var(--accent); background:transparent; border:1px solid var(--accent); border-radius:6px; padding:2px 7px; white-space:nowrap; margin-top:1px;}
.jump-link:hover{background:var(--accent); color:var(--accent-ink);}

/* ---------- Sequences: linked cards ---------- */
.seq-cards{display:flex; flex-direction:column; gap:4px; margin-top:6px; padding-top:6px; border-top:1px dashed var(--border);}
.seq-card-item{font-size:11.5px; color:var(--muted); display:flex; gap:6px;}
.seq-card-item .col-tag{flex:none; font-family:"IBM Plex Mono"; color:var(--accent-2);}
.seq-toggle{background:transparent; border:none; color:var(--accent-2); font-size:10.5px; font-family:"IBM Plex Mono"; text-align:left; padding:0;}
.seq-toggle:hover{color:var(--accent);}

/* ---------- Glossary tab links ---------- */
.gloss-link{display:inline-block; margin-top:8px; font-size:10.5px; font-family:"IBM Plex Mono"; color:var(--accent-2); background:transparent; border:1px solid var(--accent-2); border-radius:6px; padding:2px 7px;}
.gloss-link:hover{background:var(--accent-2); color:#fff;}

/* ---------- Character chips on cards ---------- */
.card-char-chips{display:flex; flex-wrap:wrap; gap:4px;}
.char-chip{font-size:10.5px; border:1px solid rgba(0,0,0,0.15); background:rgba(255,255,255,0.5); color:#5a5448; border-radius:999px; padding:2px 9px;}
.char-chip.on{background:var(--accent); border-color:var(--accent); color:#fff;}

/* ---------- Graph ---------- */
.graph-wrap{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:8px; overflow:hidden;}
.graph-svg{width:100%; height:auto; display:block;}
.graph-edge{stroke:var(--border); stroke-width:1.2;}
.graph-node{cursor:pointer;}
.graph-node text{font-family:"IBM Plex Sans"; font-size:9.5px; fill:var(--muted); text-anchor:middle; pointer-events:none;}
.graph-node:hover text{fill:var(--ink); font-weight:600;}
.graph-node-sequence circle{fill:var(--accent-2); stroke:var(--surface); stroke-width:2;}
.graph-node-character circle{fill:var(--accent); stroke:var(--surface); stroke-width:2;}
.graph-node-card circle{fill:var(--border); stroke:var(--surface); stroke-width:1.5;}
.graph-node-card.tagged circle{fill:var(--accent); opacity:.8;}
.graph-node:hover circle{stroke:var(--ink);}
.graph-legend{display:flex; align-items:center; flex-wrap:wrap; gap:4px; font-size:11.5px;}
.legend-dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:2px; vertical-align:middle;}
.legend-dot.seq{background:var(--accent-2);}
.legend-dot.char{background:var(--accent);}
.legend-dot.card{background:var(--border);}
.legend-dot.card.tagged{background:var(--accent); opacity:.8;}
</style>
</head>

<script>window.__GLOSSARY__ = [{"term": "\"Engineering\" (adaptation as engineering)", "definition": "A screenwriter's own term for the craft of adaptation: taking narrative elements that work in the medium of the novel and re-designing them so they function correctly in the very different medium of a screenplay.", "book": "Four Screenplays", "chapter": "22 - The Writer's Journey", "chapterNum": "22"}, {"term": "\"If it ain't broke, don't fix it\" (adaptation restraint)", "definition": "An adaptation principle of not inventing new material for its own sake — but inventing connective scenes, transitions, or dialogue only where compressing the source material has genuinely broken its original logic and something new is needed to bridge the gap.", "book": "Four Screenplays", "chapter": "15 - Apples and Oranges", "chapterNum": "15"}, {"term": "\"If it ain't on the page, it ain't on the stage\"", "definition": "An old Hollywood maxim meaning that action, geography, and physical detail must be spelled out precisely in the script itself — a director and crew can only stage what the screenplay actually describes.", "book": "Four Screenplays", "chapter": "11 - Bad to the Bone", "chapterNum": "11"}, {"term": "\"The novel is source material; the film is behavior\"", "definition": "An adaptation-specific version of the \"film is behavior\" principle: interior backstory or explanation from a novel is only usable in a screenplay once it's converted into something visible and playable on screen, rather than left as narrated interior thought.", "book": "Four Screenplays", "chapter": "16 - Three Fathers", "chapterNum": "16"}, {"term": "Accelerating tempo technique", "definition": "A pacing device for building tension toward a climax: scenes get progressively shorter and cuts come faster as a sequence escalates, compressing time to intensify the audience's sense of urgency.", "book": "Four Screenplays", "chapter": "25 - Dances With Wolves - The Trail of a True Human Being", "chapterNum": "25"}, {"term": "Action is character", "definition": "The principle that what a character does, not what they say about themselves, is what actually defines them for the audience — used to explain how even a non-human character (like a robot) can be read as heroic through its actions alone.", "book": "Four Screenplays", "chapter": "08 - The Hero's Journey", "chapterNum": "8"}, {"term": "All drama is conflict", "definition": "A chain-reaction formula: without conflict there is no character, without character no action, without action no story, and without story no screenplay — meaning a protagonist must keep meeting obstacles for the drama to exist at all.", "book": "Four Screenplays", "chapter": "04 - On the Run", "chapterNum": "4"}, {"term": "Ambiguous-ending principle", "definition": "The idea that a film often benefits from not tying up every loose end at its conclusion — leaving some ambiguity lets the story live longer in the audience's imagination, since real life rarely resolves as neatly as an overly logical ending suggests.", "book": "Four Screenplays", "chapter": "20 - Graduation Day", "chapterNum": "20"}, {"term": "Art of discovery", "definition": "The idea that good screenwriting reveals a character's crucial backstory only obliquely and gradually, through hints and behavior, rather than stating it outright in dialogue or exposition.", "book": "Four Screenplays", "chapter": "01 - The Phenomenon of Thelma and Louise", "chapterNum": "1"}, {"term": "Be true to the facts, not the letter", "definition": "An adaptation principle for historical or factual material: it's acceptable to change specific details (like which real-world group or setting is depicted) for practical or production reasons, as long as the underlying truth or spirit of what's being portrayed is preserved.", "book": "Four Screenplays", "chapter": "22 - The Writer's Journey", "chapterNum": "22"}, {"term": "Bookend structure", "definition": "A structure in which the opening and closing images or scenes deliberately mirror each other, so the ending directly recalls and completes the beginning — a device that can also be discarded late if test audiences show it undercuts the story's tone.", "book": "Four Screenplays", "chapter": "14 - The Perfect Sacrifice", "chapterNum": "14"}, {"term": "Change the situation, not the character", "definition": "A technique for redeeming or repurposing a character who cannot plausibly change their fixed nature: instead of altering who they are internally, change what they are externally asked or directed to do, which produces new behavior without breaking consistency.", "book": "Four Screenplays", "chapter": "09 - Approaching the Sequel", "chapterNum": "9"}, {"term": "Character mirror (nonverbal parallel)", "definition": "Using a secondary character, creature, or element (an animal, an object) whose behavior visually echoes and comments on the protagonist's inner state, functioning as a silent parallel to their emotional condition without any dialogue stating the connection.", "book": "Four Screenplays", "chapter": "24 - First Encounters", "chapterNum": "24"}, {"term": "Chord of truth", "definition": "The idea that the real test of good screenwriting is whether a line or moment strikes a recognition that transcends culture, race, age, or geography — a universal truth the audience feels is true of people in general, not just a clever plot beat.", "book": "Four Screenplays", "chapter": "05 - The Con Man and the Thief", "chapterNum": "5"}, {"term": "Comic relief after tragedy", "definition": "A classical technique (traced back to the drunken porter scene after a murder in Macbeth) of following a serious or tragic beat immediately with a moment of humor, giving the audience emotional relief before the story returns to darker material.", "book": "Four Screenplays", "chapter": "07 - Journey's End", "chapterNum": "7"}, {"term": "Community of emotion", "definition": "The phenomenon of a movie theater audience — regardless of individual differences in gender, race, or background — reacting to a powerful scene as a single unified emotional entity, all feeling the same thing at the same moment.", "book": "Four Screenplays", "chapter": "12 - Escape from Pescadero", "chapterNum": "12"}, {"term": "Consistency of caricature", "definition": "The principle that a simplified, comic, or one-note character works dramatically not because of complexity but because they behave with total consistency to the shallow trait they were established with — inconsistency, not simplicity, is what breaks a caricature.", "book": "Four Screenplays", "chapter": "06 - No Turning Back", "chapterNum": "6"}, {"term": "Contradiction of image", "definition": "A technique of establishing one strong visual impression and then immediately subverting or reversing it with a second image, without dialogue — for example, dissolving from a sunny present-day street into the same street as a nuclear ruin, instantly redefining what the audience thought they were looking at.", "book": "Four Screenplays", "chapter": "11 - Bad to the Bone", "chapterNum": "11"}, {"term": "Cross-cutting subplot construction", "definition": "A method for building a subplot by first writing its whole line of action from beginning to end on its own, then cutting it into pieces and interweaving those pieces scene-by-scene with the main plot, rather than writing the two threads simultaneously as they occur to you.", "book": "Four Screenplays", "chapter": "04 - On the Run", "chapterNum": "4"}, {"term": "Decide whose story it is", "definition": "An early, decisive adaptation choice: commit to which character's point of view the film will follow, then cut everything — however good — that doesn't serve that character's presence and arc, even beloved subplots from the source material.", "book": "Four Screenplays", "chapter": "15 - Apples and Oranges", "chapterNum": "15"}, {"term": "Departure, Fulfillment, Return", "definition": "A three-word structural relabeling of the standard three-act shape for a hero's-journey story: Act I as leaving one's original world (Departure), Act II as finding belonging or purpose in a new one (Fulfillment), and Act III as being forced back into the world left behind (Return).", "book": "Four Screenplays", "chapter": "26 - The Wheel of Life", "chapterNum": "26"}, {"term": "Dramatic hook / inciting incident", "definition": "The specific event early in a story that springs the entire screenplay into motion — the moment that creates the situation everything afterward reacts to.", "book": "Four Screenplays", "chapter": "03 - Setting Up Character", "chapterNum": "3"}, {"term": "Dramatic need declared directly in dialogue", "definition": "A technique where a character's core want is stated outright in a single memorable line, functioning as the transactional engine that drives the rest of the story rather than being left implicit.", "book": "Four Screenplays", "chapter": "16 - Three Fathers", "chapterNum": "16"}, {"term": "Dream sequences rarely work on screen", "definition": "A blunt, practical rule that dream sequences, however illuminating they may be about a character's psychology in prose, tend to fall flat and feel like a narrative dead end when translated directly to film, and are often better cut.", "book": "Four Screenplays", "chapter": "22 - The Writer's Journey", "chapterNum": "22"}, {"term": "Earned naming/title payoff", "definition": "A technique where a character's name, title, or nickname (which may also be the film's title) is only assigned after another character has directly witnessed the behavior that justifies it — making the label feel earned through prior action rather than arbitrarily given.", "book": "Four Screenplays", "chapter": "25 - Dances With Wolves - The Trail of a True Human Being", "chapterNum": "25"}, {"term": "Effects grown from the story, not bolted on", "definition": "The practice of writing the physical logic and rules of a visual effect into the script as narrative description before the effect is technically possible to create, so the effects team solves a problem the story actually needs rather than effects being added on top of an unrelated plot.", "book": "Four Screenplays", "chapter": "12 - Escape from Pescadero", "chapterNum": "12"}, {"term": "Enter late, get out early", "definition": "A scene-construction rule: once characters and situation are already established, start a scene as close to its point as possible and leave as soon as the point is made — a single terse exchange can carry a reaction that would otherwise require a full explanatory scene.", "book": "Four Screenplays", "chapter": "04 - On the Run", "chapterNum": "4"}, {"term": "Film is behavior", "definition": "A principle borrowed from director Michelangelo Antonioni: character and relationship are best established through what people physically do, not through what they say about themselves. A screenplay can open with two contrasting, matched physical actions to establish two entire lives before any dialogue is spoken.", "book": "Four Screenplays", "chapter": "02 - On the Road to Liberation", "chapterNum": "2"}, {"term": "Finding the metaphorical opening image", "definition": "The practice of not simply filming a source novel's literal first pages, but searching the material for whichever image or moment best captures the story's real underlying subject, even if it comes from deep inside the book or wasn't originally intended as an opening.", "book": "Four Screenplays", "chapter": "16 - Three Fathers", "chapterNum": "16"}, {"term": "First principles interrogation method", "definition": "A method of understanding a character or mystery by stripping away surface behavior and asking foundational questions — what is this person's essential nature, and what does he actually do — until a single defining trait (their core desire) emerges as the answer.", "book": "Four Screenplays", "chapter": "19 - Teacher - First Principles", "chapterNum": "19"}, {"term": "Flashback discipline", "definition": "A rule for when a flashback is justified: it must reveal information — usually emotional rather than factual — that cannot be conveyed any other way, and it must move the story forward rather than repeating what dialogue or other means have already established.", "book": "Four Screenplays", "chapter": "17 - Partners in Crime", "chapterNum": "17"}, {"term": "Henry James's Theory of Illumination", "definition": "A technique in which a character is revealed not through their own actions or self-description but through what another character says about them, letting two characters define each other simultaneously in a single exchange.", "book": "Four Screenplays", "chapter": "03 - Setting Up Character", "chapterNum": "3"}, {"term": "Humanizing the antagonist before the turn", "definition": "Introducing a character who will later become or seem like a threat through sympathetic details (family life, warmth, ordinary vulnerability) before putting them in danger or revealing darker implications, so the audience's sympathy is secured first rather than the character being written as an obvious villain from the start.", "book": "Four Screenplays", "chapter": "13 - Things to Come", "chapterNum": "13"}, {"term": "Implying resolution rather than showing it", "definition": "Ending a story on a suspended or ambiguous image (like a freeze-frame just before an outcome) instead of depicting the outcome directly, letting the audience feel the resolution emotionally without watching its literal consequence.", "book": "Four Screenplays", "chapter": "07 - Journey's End", "chapterNum": "7"}, {"term": "Inner arc completion vs. external resolution", "definition": "The distinction between a character finishing their internal, emotional journey (achieving what they truly wanted or needed) and the story itself reaching its narrative conclusion — a character's inner arc can be complete well before the plot's external conflicts are actually resolved, since drama requires ongoing conflict to keep going.", "book": "Four Screenplays", "chapter": "25 - Dances With Wolves - The Trail of a True Human Being", "chapterNum": "25"}, {"term": "Insurance-scene test", "definition": "Before committing resources to shoot a planned supporting scene (like a flashback meant to reinforce a dialogue exchange), test whether the dialogue alone already fully carries the needed emotional information — if it does, the extra scene may be redundant and can be cut before it's ever shot.", "book": "Four Screenplays", "chapter": "19 - Teacher - First Principles", "chapterNum": "19"}, {"term": "Internal consistency of a fantastical power", "definition": "The practice of inventing explicit, self-imposed limits for a fantastical ability (what it can and cannot do) before writing scenes that use it, so the power stays dramatically fair and believable rather than becoming an anything-goes escape hatch for the plot.", "book": "Four Screenplays", "chapter": "10 - Liquid Metal", "chapterNum": "10"}, {"term": "Invisible transitions", "definition": "The rule that a good scene transition should never call attention to itself — if a viewer or reader notices a transition as a transition, it's probably not working. One reliable technique is having a later scene answer a question posed at the end of the previous one.", "book": "Four Screenplays", "chapter": "16 - Three Fathers", "chapterNum": "16"}, {"term": "Matched-cut characterization", "definition": "An opening technique in which two characters are introduced by intercutting a visually similar gesture each of them performs in their own separate setting, letting the contrast between their circumstances register instantly without dialogue.", "book": "Four Screenplays", "chapter": "02 - On the Road to Liberation", "chapterNum": "2"}, {"term": "Mid-Point", "definition": "The event roughly in the middle of Act II that connects the first half of the act to the second half, typically by removing or changing the protagonist's means or plan and forcing a shift from a passive, reactive mode into an active one.", "book": "Four Screenplays", "chapter": "05 - The Con Man and the Thief", "chapterNum": "5"}, {"term": "Modern tragedy", "definition": "A definition of tragedy suited to contemporary stories: not a great figure brought low by a personal flaw, but an ordinary person thrust into extraordinary circumstances, where the situation itself creates the potential for tragedy and permanently reshapes who they are.", "book": "Four Screenplays", "chapter": "09 - Approaching the Sequel", "chapterNum": "9"}, {"term": "Most-extreme-version premise technique", "definition": "A premise-generation exercise: take a story idea and push it to its most extreme or ironic version to find its strongest hook — for example, asking who the least likely person would be if the whole world's fate depended on that one person.", "book": "Four Screenplays", "chapter": "08 - The Hero's Journey", "chapterNum": "8"}, {"term": "Normalcy as horror", "definition": "A Hitchcock-derived technique of making the most ordinary-seeming scene the most frightening one, because the audience already knows a danger the surface dialogue and behavior don't reveal — dread comes from the gap between calm appearance and known threat.", "book": "Four Screenplays", "chapter": "12 - Escape from Pescadero", "chapterNum": "12"}, {"term": "Novel as tree, screenplay as line", "definition": "An analogy for the structural difference between the two forms: a novel is like a tree, with a central idea branching outward into many digressive explorations, while a screenplay must stay linear and always moving forward, unable to sustain the same digressive structure.", "book": "Four Screenplays", "chapter": "23 - The Strangeness of Life", "chapterNum": "23"}, {"term": "Novel vs. play vs. screenplay (medium comparison)", "definition": "A distinction between how each form tells a story: a novel lives inside a character's interior thoughts and memories; a play lives in dialogue delivered live to an audience; a screenplay has no direct access to interior monologue and must tell its story entirely through externals — visual action broken into shots and scenes.", "book": "Four Screenplays", "chapter": "11 - Bad to the Bone", "chapterNum": "11"}, {"term": "Open story vs. closed story", "definition": "Two ways to control audience knowledge: in a closed story, the audience learns what's happening at the same moment as the character; in an open story, the audience already knows something the character doesn't yet know, and tension comes from watching the character catch up to that knowledge.", "book": "Four Screenplays", "chapter": "20 - Graduation Day", "chapterNum": "20"}, {"term": "Opening up a dialogue scene", "definition": "Staging a scene that is essentially exposition or characterization delivered through dialogue in a more physically dynamic setting (like jogging outdoors instead of sitting in a room), giving the material visual life and room for a director to work with movement.", "book": "Four Screenplays", "chapter": "17 - Partners in Crime", "chapterNum": "17"}, {"term": "Passive-to-active turning point", "definition": "A clear moment where a protagonist who has been merely waiting or reacting explicitly decides to take initiative and pursue their goal directly — often marked by the character stating their own shift in a line of dialogue or voice-over.", "book": "Four Screenplays", "chapter": "24 - First Encounters", "chapterNum": "24"}, {"term": "Peaks and valleys", "definition": "A pacing principle for action-driven stories: alternate high-intensity action with quieter rest points so the audience can breathe, rather than running nonstop action from start to finish, which becomes numbing and boring no matter how well executed.", "book": "Four Screenplays", "chapter": "13 - Things to Come", "chapterNum": "13"}, {"term": "Physical and spiritual hero's journey", "definition": "A way of splitting a protagonist's arc into two simultaneous challenges: an external, physical trial (surviving danger, defending others) and an internal, spiritual one (a transformation of consciousness or belief) — both need to resolve for the journey to feel complete.", "book": "Four Screenplays", "chapter": "21 - Trail of Many Tears", "chapterNum": "21"}, {"term": "Pinch", "definition": "A sequence (which can be as short as one scene or as long as most of an act) placed partway through a story half whose only job is to keep that half of the screenplay on track — reorienting the action before it drifts. Pinch I typically falls partway through the first half of Act II, and Pinch II partway through the second half.", "book": "Four Screenplays", "chapter": "05 - The Con Man and the Thief", "chapterNum": "5"}, {"term": "Playing against the grain", "definition": "Deliberately withholding or delaying the expected choice, reaction, or plot development so the story doesn't move in the most obvious direction — for example, having a character decline something first before circling back and accepting it once motivation builds.", "book": "Four Screenplays", "chapter": "05 - The Con Man and the Thief", "chapterNum": "5"}, {"term": "Plot Point", "definition": "Any incident, episode, or event that hooks into the ongoing action of a story and spins it around into a new direction. A screenplay may contain several, but the ones ending Act I and Act II are the most important structural anchors, and a writer should know them (along with the beginning and ending) before starting to write.", "book": "Four Screenplays", "chapter": "03 - Setting Up Character", "chapterNum": "3"}, {"term": "Plot Point defined by function, not shock value", "definition": "A reminder that the most viscerally dramatic or shocking scene in a sequence is not automatically the structural Plot Point — the true Plot Point is whichever event actually advances the dramatic need driving the story forward, even if a more startling scene happens nearby.", "book": "Four Screenplays", "chapter": "18 - Quid Pro Quo", "chapterNum": "18"}, {"term": "Plot Point flexibility", "definition": "The observation that a Plot Point does not need to be a dramatic or loud event — it can be a completely silent, wordless moment — because what defines a Plot Point is its structural function of spinning the story into the next act, not its intensity or visibility.", "book": "Four Screenplays", "chapter": "06 - No Turning Back", "chapterNum": "6"}, {"term": "Promoting a minor detail into a major structural beat", "definition": "Taking a small, easily-passed-over detail from source material and elevating it into a significant plot element in the adaptation, because film pacing often needs a stronger hook or clue than prose requires.", "book": "Four Screenplays", "chapter": "18 - Quid Pro Quo", "chapterNum": "18"}, {"term": "Protective self-sacrifice ending", "definition": "An ending in which a protagonist chooses to give up something precious (a home, a connection, even their life) specifically to protect others from consequences that would fall on them otherwise — the sacrifice is framed as an act of protection rather than defeat.", "book": "Four Screenplays", "chapter": "26 - The Wheel of Life", "chapterNum": "26"}, {"term": "Scene-by-scene card breakdown (adaptation method)", "definition": "A method for adapting a novel by first breaking the entire book down scene by scene onto individual cards, giving the adapter a manipulable structural map they can reorder, cut, and compress before drafting the screenplay.", "book": "Four Screenplays", "chapter": "15 - Apples and Oranges", "chapterNum": "15"}, {"term": "Screenplay as organism", "definition": "The principle that a screenplay's elements are interdependent — changing one thing (a character choice, a scene order, a plot beat) requires re-examining and often changing other connected elements, since nothing in a working structure exists in isolation.", "book": "Four Screenplays", "chapter": "18 - Quid Pro Quo", "chapterNum": "18"}, {"term": "Separate agendas of novel and film", "definition": "The idea that a novel and its film adaptation are two distinct works, each pursuing its own goals in its own medium — a screenwriter's job is not to reproduce the book but to make an adaptation that succeeds cinematically on its own terms.", "book": "Four Screenplays", "chapter": "15 - Apples and Oranges", "chapterNum": "15"}, {"term": "Setup and payoff (early plant)", "definition": "Introducing a small visual or narrative detail early in a screenplay purely so that a later scene can use it without needing fresh explanation — the audience has already been quietly prepared to accept it.", "book": "Four Screenplays", "chapter": "02 - On the Road to Liberation", "chapterNum": "2"}, {"term": "Sharing experience (as an alternative to character-building)", "definition": "An approach to characterization in which a writer doesn't construct a character from biographical facts, but instead imaginatively lives through the character's experiences as though undergoing them personally — a legitimate alternative to more analytical character-biography methods.", "book": "Four Screenplays", "chapter": "22 - The Writer's Journey", "chapterNum": "22"}, {"term": "Shot, scene, and sequence", "definition": "The basic units of screenplay grammar: a shot is a single thing the camera sees; a scene is one or more shots unified by one place and one time (changing either starts a new scene); a sequence is a series of scenes connected by one governing idea (a chase, a wedding), with its own beginning, middle, and end, built like a miniature act.", "book": "Four Screenplays", "chapter": "17 - Partners in Crime", "chapterNum": "17"}, {"term": "Showing the result before the action", "definition": "A structural trick where the outcome of an event (e.g., a character fleeing with stolen money) is shown first, and only later is the event itself revealed — collapsing multiple characters' reactions into a compressed sequence without needing direct narration of what happened.", "book": "Four Screenplays", "chapter": "06 - No Turning Back", "chapterNum": "6"}, {"term": "Structure-as-sonata metaphor", "definition": "Describing a section of a screenplay's structure using a musical analogy — distinct sequential \"movements,\" each with its own content and mood, that build toward a larger cumulative effect the way movements build a musical piece.", "book": "Four Screenplays", "chapter": "24 - First Encounters", "chapterNum": "24"}, {"term": "Sub-dramatic context", "definition": "A short phrase naming the underlying emotional or functional task a section of a screenplay is performing (e.g., \"what to do\") — a way of keeping a stretch of scenes unified even though the surface events vary widely.", "book": "Four Screenplays", "chapter": "04 - On the Run", "chapterNum": "4"}, {"term": "Test-screening override", "definition": "The real-world practice of dropping a filmmaker's originally intended ending after audience test screenings show it doesn't work, replacing it with a version whose tone better matches the rest of the film — a documented case of data overriding original creative intent.", "book": "Four Screenplays", "chapter": "14 - The Perfect Sacrifice", "chapterNum": "14"}, {"term": "The kicker", "definition": "A technique where, just as the audience believes the story or threat is resolved, they are suddenly thrust into new territory that escalates the stakes even further than expected — a directorial or authorial signature move that resets the audience's sense of how far the story can still go.", "book": "Four Screenplays", "chapter": "14 - The Perfect Sacrifice", "chapterNum": "14"}, {"term": "The three possible endings", "definition": "A framework for closing out a story once the point of no return has been passed: the protagonist can escape (often unsatisfying if it doesn't feel earned), be captured or surrender (often bitter), or die — and the writer should test which of the three is the only one that feels emotionally correct given everything that came before.", "book": "Four Screenplays", "chapter": "07 - Journey's End", "chapterNum": "7"}, {"term": "Trust the audience, cut the explanation", "definition": "The principle that a lengthy scripted mechanism or explanation can sometimes be compressed into a single well-placed line of dialogue without losing the underlying idea, because audiences will fill in the rest themselves.", "book": "Four Screenplays", "chapter": "12 - Escape from Pescadero", "chapterNum": "12"}, {"term": "Two halves of one whole", "definition": "A way two distinct protagonists can function as a single composite main character — sharing one dramatic need, one arc, and one fate — so that their surface differences read as ordinary friction rather than real dramatic conflict between them.", "book": "Four Screenplays", "chapter": "03 - Setting Up Character", "chapterNum": "3"}, {"term": "Two ways to open a screenplay", "definition": "A simplification of opening strategy into two effective options: a dynamic action hook that grabs attention immediately, or a slower character-driven opening that takes its time establishing who someone is — genre usually dictates which is the right fit.", "book": "Four Screenplays", "chapter": "23 - The Strangeness of Life", "chapterNum": "23"}, {"term": "Voice-over usage rule", "definition": "A guideline for when narrated voice-over is justified: it works best when the main character is isolated and has few people to talk to, substituting for the dialogue-based exposition a more populated story could otherwise rely on.", "book": "Four Screenplays", "chapter": "23 - The Strangeness of Life", "chapterNum": "23"}, {"term": "Willing suspension of disbelief", "definition": "Coleridge's term for the reader's or viewer's choice to accept a story's premises as real for the duration of the experience — used as the necessary lens for taking genre and action films seriously as craft, since most fail to actually earn it.", "book": "Four Screenplays", "chapter": "08 - The Hero's Journey", "chapterNum": "8"}, {"term": "Write it now, cut it later", "definition": "Practical advice for an uncertain scene: when unsure whether a scene belongs, write it anyway, because it's much easier to cut a written scene later than to realize afterward you need a scene you never wrote and have to retrofit it in.", "book": "Four Screenplays", "chapter": "07 - Journey's End", "chapterNum": "7"}, {"term": "Write the sequel as if the first film never existed", "definition": "An approach to sequel-writing in which backstory and character history are dramatized from scratch within the new film, rather than assumed as known, so a viewer who never saw the original can still follow and feel the emotional stakes.", "book": "Four Screenplays", "chapter": "09 - Approaching the Sequel", "chapterNum": "9"}, {"term": "Writing \"in the pit\"", "definition": "Industry slang for writing a screenplay under an extreme, often externally imposed deadline (such as a release date announced before the script exists), forcing a compressed, high-pressure writing process.", "book": "Four Screenplays", "chapter": "10 - Liquid Metal", "chapterNum": "10"}, {"term": "Writing to the gap (subtext of the unsaid)", "definition": "Constructing a pivotal emotional scene around what characters deliberately do not say to each other — the real content of the scene lives in the gap between their actual words and their unspoken feelings or intentions.", "book": "Four Screenplays", "chapter": "05 - The Con Man and the Thief", "chapterNum": "5"}, {"term": "3x5 Card Method", "definition": "Field's technique for outlining a screenplay before writing it: jotting one scene or sequence idea (5-6 words) per index card, then arranging roughly 14 cards per act (about 56 total for a 120-page script) to test whether an act is too thin or overstuffed before drafting begins.", "book": "Screenplay", "chapter": "12 - Building the Story Line", "chapterNum": "12"}, {"term": "Aristotle's Three Unities", "definition": "The classical dramatic principle of unity of time, place, and action, cited as the historical root of a screenplay's fixed running length and single through-line of story.", "book": "Screenplay", "chapter": "01 - What Is a Screenplay", "chapterNum": "1"}, {"term": "Attitude (Character)", "definition": "A character's intellectual judgment or manner toward specific things (right/wrong, superior/inferior, optimistic/pessimistic), which governs their moment-to-moment behavior — more surface-level than point of view, though the line between the two is often fuzzy.", "book": "Screenplay", "chapter": "04 - Building a Character", "chapterNum": "4"}, {"term": "Beat Sheet", "definition": "A short outline (roughly 2-3 pages) breaking a story down into its major beats, used especially when adapting existing source material to decide what to keep, cut, or invent.", "book": "Screenplay", "chapter": "15 - Adaptation", "chapterNum": "15"}, {"term": "Centerpiece (Set-Piece)", "definition": "A major, memorable sequence a writer builds an entire story around, letting everything before and after it flow toward and away from that anchor scene.", "book": "Screenplay", "chapter": "04 - Building a Character", "chapterNum": "4"}, {"term": "Character Arc", "definition": "The path of emotional change and growth a character travels across a story, built from the foundation of their character biography — most characters end the story different from how they began it.", "book": "Screenplay", "chapter": "03 - The Creation of Character", "chapterNum": "3"}, {"term": "Character Biography", "definition": "A free-associative writing exercise tracing a character's life from birth to the start of the story (family, childhood, school, relationships, career) to build depth of knowledge for the writer, even though most of it never appears on the page.", "book": "Screenplay", "chapter": "03 - The Creation of Character", "chapterNum": "3"}, {"term": "Character vs. Characterization", "definition": "Character is a person's deep-seated nature — their values, beliefs, and actions. Characterization is the surface expression of that nature — clothes, car, taste, and how they appear to others.", "book": "Screenplay", "chapter": "03 - The Creation of Character", "chapterNum": "3"}, {"term": "Context and Content (Scene Building)", "definition": "A scene's context is its underlying purpose — why it exists and what it moves forward or reveals; its content is the specific choices made to realize that purpose — the place, time, characters, and events.", "book": "Screenplay", "chapter": "10 - The Scene", "chapterNum": "10"}, {"term": "Contradiction of Image", "definition": "A technique (associated with director Sam Peckinpah) of interweaving a main action with ironic, thematically loaded counterpoint imagery happening simultaneously, so the sequence carries thematic weight beyond its surface mechanics.", "book": "Screenplay", "chapter": "11 - The Sequence", "chapterNum": "11"}, {"term": "Coverage", "definition": "The written synopsis and evaluation that a studio or production company reader produces for every script submission, logged under the script's title and author — a rejected script resubmitted under the same title tends to be judged by its old coverage rather than read fresh.", "book": "Screenplay", "chapter": "17 - After It's Written", "chapterNum": "17"}, {"term": "Dramatic Need", "definition": "What the main character wants to win, get, gain, or achieve over the course of the story. Once a writer knows the need, they can invent the obstacles that block it, and the overcoming of those obstacles becomes the plot.", "book": "Screenplay", "chapter": "01 - What Is a Screenplay", "chapterNum": "1"}, {"term": "Dramatic Premise", "definition": "The underlying idea or question a screenplay dramatizes — what the story is about at its core, often statable as a single driving question (e.g., who is having an affair with whom).", "book": "Screenplay", "chapter": "00 - Introduction", "chapterNum": "Intro"}, {"term": "Dramatic Situation", "definition": "The specific circumstances and conditions surrounding the story's action — the setting and context the characters are placed within that generates the events of the plot.", "book": "Screenplay", "chapter": "00 - Introduction", "chapterNum": "Intro"}, {"term": "Dramatic Structure (formal definition)", "definition": "A linear arrangement of related incidents, episodes, or events that leads to a dramatic resolution.", "book": "Screenplay", "chapter": "01 - What Is a Screenplay", "chapterNum": "1"}, {"term": "Exposition", "definition": "The background information a script needs to deliver so the audience understands who the characters are and what's happening, allowing the story to proceed.", "book": "Screenplay", "chapter": "09 - Plot Points", "chapterNum": "9"}, {"term": "Exterior Life", "definition": "Everything about a character that happens on-page, from the story's fade-in to its fade-out — the process by which their interior life is revealed to the audience through action.", "book": "Screenplay", "chapter": "03 - The Creation of Character", "chapterNum": "3"}, {"term": "Externalizing Interior Monologue", "definition": "A common challenge in adaptation: converting a character's private, unspoken thoughts from a novel into visible action or spoken dialogue, since a screenplay cannot show interiority directly.", "book": "Screenplay", "chapter": "15 - Adaptation", "chapterNum": "15"}, {"term": "Flash Present", "definition": "An alternate term for a flashback scene, framing it not as a dip into 'the past' but as a scene that plays out in its own present tense.", "book": "Screenplay", "chapter": "10 - The Scene", "chapterNum": "10"}, {"term": "Form vs. Formula", "definition": "Form is a flexible shape allowing infinite variation within it (like a coat, which always has two arms but can look countless ways); formula is a rigid, identical output every time (like an assembly line). Screenplay structure is a form, not a formula — story determines structure, not the reverse.", "book": "Screenplay", "chapter": "01 - What Is a Screenplay", "chapterNum": "1"}, {"term": "Henry James's Theory of Illumination", "definition": "The idea that a main character sits at the center of a circle of other characters, and each interaction with them 'turns on a lamp' that illuminates a different facet of the main character, without the character having to state it directly.", "book": "Screenplay", "chapter": "04 - Building a Character", "chapterNum": "4"}, {"term": "Inciting Incident", "definition": "The opening scene or sequence of a screenplay that grabs the audience's attention and sets the story in motion by drawing the main character into the action.", "book": "Screenplay", "chapter": "06 - Endings and Beginnings", "chapterNum": "6"}, {"term": "Interior Life", "definition": "Everything about a character from birth up to the point the story begins — the private history and formative experiences that shape who they are, usually developed through a character biography exercise even though little of it appears directly on screen.", "book": "Screenplay", "chapter": "03 - The Creation of Character", "chapterNum": "3"}, {"term": "Internal vs. External Conflict", "definition": "Conflict, the hub of all drama, can originate inside a character as emotional or psychological opposition, or outside them as physical obstacles in the world — many strong screenplays use both simultaneously.", "book": "Screenplay", "chapter": "14 - Writing the Screenplay", "chapterNum": "14"}, {"term": "Key Incident", "definition": "The concrete dramatic scene that visualizes the story's dramatic premise on screen — the hub the whole story revolves around. It is often, but not always, the same beat as Plot Point I, and in some films it occurs before the story even starts.", "book": "Screenplay", "chapter": "08 - Two Incidents", "chapterNum": "8"}, {"term": "Live Research", "definition": "Gathering background knowledge for a screenplay through direct, firsthand contact — interviews and conversations with people who have lived or know the subject matter.", "book": "Screenplay", "chapter": "02 - The Subject", "chapterNum": "2"}, {"term": "Master Shot vs. Specific Shot", "definition": "A master shot covers a general area such as a room or street, while a specific shot isolates a single detail within it — writers choose between them based on what the story needs, without dictating actual camera direction.", "book": "Screenplay", "chapter": "13 - Screenplay Form", "chapterNum": "13"}, {"term": "Mid-Point", "definition": "A story-progression beat roughly at the middle of Act II (around page 60) — an incident, scene, or even a line of dialogue whose job is to move the story forward and anchor the act's midsection, splitting Act II into a first half and second half.", "book": "Screenplay", "chapter": "09 - Plot Points", "chapterNum": "9"}, {"term": "Mission Statement (Collaboration)", "definition": "A short, shared statement collaborators create together early in a co-writing project to define the tone and goal of the screenplay (e.g., 'an engaging, edge-of-the-seat page-turner'), paired with the agreed value of serving the material over personal ego.", "book": "Screenplay", "chapter": "16 - On Collaboration", "chapterNum": "16"}, {"term": "Objective Cut", "definition": "The second stage of drafting a screenplay: mechanically reducing an overwritten first draft (often 180-200 pages) down to a workable length (roughly 130-140 pages) through cutting, reordering, and patching, before the polish stage.", "book": "Screenplay", "chapter": "14 - Writing the Screenplay", "chapterNum": "14"}, {"term": "Option (Screenplay Rights)", "definition": "A common way screenplays are sold: a buyer pays for the exclusive right to develop or produce a script for a set period of time, rather than purchasing it outright.", "book": "Screenplay", "chapter": "17 - After It's Written", "chapterNum": "17"}, {"term": "Paradigm", "definition": "A conceptual model or shape for a screenplay's structure, akin to a diagram of a table as a top with four legs — the underlying pattern stays constant even though its specific expression (genre, tone, story) varies infinitely.", "book": "Screenplay", "chapter": "01 - What Is a Screenplay", "chapterNum": "1"}, {"term": "Parenthetical", "definition": "A brief stage direction placed under a character's name in the script, just before their dialogue, used sparingly to indicate tone or action — overuse is a common amateur mistake since actors tend to perform lines their own way regardless.", "book": "Screenplay", "chapter": "13 - Screenplay Form", "chapterNum": "13"}, {"term": "Physical Action vs. Emotional Action", "definition": "The two kinds of action a story's subject can dramatize: physical action is external and visible (chases, battles, competitions), while emotional action is internal and relational (feelings, relationships). Most films blend both.", "book": "Screenplay", "chapter": "02 - The Subject", "chapterNum": "2"}, {"term": "Playing Against the Grain", "definition": "A scene-writing technique of choosing the non-obvious emotional approach to a moment — for example, playing anger through soft, polite smiling rather than shouting — to create more interesting, less predictable drama.", "book": "Screenplay", "chapter": "10 - The Scene", "chapterNum": "10"}, {"term": "Plot Point", "definition": "Any incident, episode, or event that hooks into the story's action and spins it around in a new direction. A screenplay may contain many plot points, but two — Plot Point I and Plot Point II — anchor the ends of Act I and Act II.", "book": "Screenplay", "chapter": "01 - What Is a Screenplay", "chapterNum": "1"}, {"term": "Plot Point I", "definition": "The incident at the end of Act I (roughly page 20-30) that turns the story from Set-Up into Confrontation and is always tied to the main character's situation or choice.", "book": "Screenplay", "chapter": "01 - What Is a Screenplay", "chapterNum": "1"}, {"term": "Plot Point II", "definition": "The incident at the end of Act II (roughly page 85-90) that turns the story from Confrontation into Resolution, setting up the final act.", "book": "Screenplay", "chapter": "01 - What Is a Screenplay", "chapterNum": "1"}, {"term": "Point of View (Character)", "definition": "A character's acquired belief system about how the world works (e.g., 'life is unfair') — a fundamental lens through which they see everything, distinct from a simple opinion and not inherently right or wrong.", "book": "Screenplay", "chapter": "04 - Building a Character", "chapterNum": "4"}, {"term": "Poor Man's Copyright", "definition": "An informal, legally weak method of establishing a creation date for a script by mailing a sealed copy of it to oneself and never opening the envelope.", "book": "Screenplay", "chapter": "17 - After It's Written", "chapterNum": "17"}, {"term": "Resolution", "definition": "The true meaning of a story's ending — not the literal final scene, but the solution to the central dramatic question: whether the character gets what they need or not.", "book": "Screenplay", "chapter": "06 - Endings and Beginnings", "chapterNum": "6"}, {"term": "Right Against Right", "definition": "A structural principle for strong dramatic conflict: rather than good versus evil, the most powerful conflicts pit two characters who are each right from their own point of view, so neither is simply a villain.", "book": "Screenplay", "chapter": "08 - Two Incidents", "chapterNum": "8"}, {"term": "Scene", "definition": "The basic unit of dramatic action in a screenplay — the place where something specific happens. Every scene should either move the story forward or reveal character; if it does neither, it should be cut.", "book": "Screenplay", "chapter": "10 - The Scene", "chapterNum": "10"}, {"term": "Screenplay", "definition": "A story told through pictures, dialogue, and description, organized within the framework of dramatic structure. It is fundamentally a visual medium, distinct from a novel (interior thought) or a play (spoken language on a stage).", "book": "Screenplay", "chapter": "00 - Introduction", "chapterNum": "Intro"}, {"term": "Sequence", "definition": "A series of scenes connected by one single idea or context, with its own definite beginning, middle, and end — often expressible in one or two words, such as a wedding, a chase, or a heist. Considered the backbone that holds a screenplay together.", "book": "Screenplay", "chapter": "11 - The Sequence", "chapterNum": "11"}, {"term": "Serve the Material", "definition": "The governing principle for resolving creative disagreements in a collaboration: decisions should be made based on what's best for the script, not on which collaborator is 'right.'", "book": "Screenplay", "chapter": "16 - On Collaboration", "chapterNum": "16"}, {"term": "Set-Up, Confrontation, Resolution", "definition": "The three-part shape underlying all dramatic storytelling: establishing the characters and situation, dramatizing the obstacles they face, and then resolving the story. This is the seed of the three-act structure.", "book": "Screenplay", "chapter": "00 - Introduction", "chapterNum": "Intro"}, {"term": "Slug Line", "definition": "The capitalized scene heading (e.g., INT. KITCHEN - DAY) that fixes a scene's place and time. Changing either the place or the time creates a new scene, since it requires a new lighting and camera setup.", "book": "Screenplay", "chapter": "10 - The Scene", "chapterNum": "10"}, {"term": "Structure", "definition": "The relationship between the parts of a screenplay and the whole — how action, character, conflict, scenes, sequences, and dialogue fit together, the way pieces, players, and rules fit together in a game of chess.", "book": "Screenplay", "chapter": "01 - What Is a Screenplay", "chapterNum": "1"}, {"term": "Subject", "definition": "The combination of action (what the story is about) and character (who it is about). A usable subject can be reduced to a simple sentence: this person, in this place, doing this thing.", "book": "Screenplay", "chapter": "02 - The Subject", "chapterNum": "2"}, {"term": "Tag Scene", "definition": "A short scene or beat placed after a story's main dramatic question has already been resolved, used to tie off a final note or provide closure.", "book": "Screenplay", "chapter": "06 - Endings and Beginnings", "chapterNum": "6"}, {"term": "Text Research", "definition": "Gathering background knowledge for a screenplay through library and print sources, especially useful for period settings or unfamiliar subject matter.", "book": "Screenplay", "chapter": "02 - The Subject", "chapterNum": "2"}, {"term": "The Critic's Page", "definition": "A writer's-block technique: keeping a separate page where every self-critical thought is written down verbatim as it arises during drafting, then reviewing it later to see that the inner critic repeats the same handful of complaints regardless of the work's actual quality.", "book": "Screenplay", "chapter": "14 - Writing the Screenplay", "chapterNum": "14"}, {"term": "Three-Act Structure", "definition": "The standard model dividing a screenplay into Act I (Set-Up, roughly pages 1-20/30), Act II (Confrontation, roughly pages 20/30-85/90), and Act III (Resolution, from roughly page 85/90 to the end), each with a distinct dramatic function.", "book": "Screenplay", "chapter": "01 - What Is a Screenplay", "chapterNum": "1"}, {"term": "Treatment", "definition": "A narrative synopsis of a screenplay's story, typically 4-20 pages long, written in prose rather than script format — one alternative to card outlining, though not Field's preferred method.", "book": "Screenplay", "chapter": "12 - Building the Story Line", "chapterNum": "12"}, {"term": "Up Ending / Ambiguous Ending / Down Ending", "definition": "The three legitimate types of story resolution: an up ending resolves well for the characters, an ambiguous ending is left open to audience interpretation, and a down ending resolves badly. All three are valid as long as they're true to the story and characters.", "book": "Screenplay", "chapter": "05 - Story and Character", "chapterNum": "5"}, {"term": "\"A Day in the Life\" (Pages 11–20)", "definition": "The specific rule governing the second ten-page zone of Act I: the main character should appear in almost every scene of these pages, so the audience comes to know who they are through ordinary, representative action rather than through plot events being pushed forward.", "book": "Screenwriter's Workbook", "chapter": "11 - The Second and Third Ten Pages", "chapterNum": "11"}, {"term": "\"Dialogue Is Perishable, Dramatic Need Is Sacrosanct\" (Waldo Salt)", "definition": "A working principle from screenwriter Waldo Salt: once a character's dramatic need is established, the actual dialogue used to express it is flexible and replaceable (an actor can improvise around it), but the dramatic need itself must never change, because it's what holds the entire story together.", "book": "Screenwriter's Workbook", "chapter": "05 - What Makes Good Character", "chapterNum": "05"}, {"term": "\"Enter Late, Get Out Early\"", "definition": "William Goldman's rule for scene construction: every scene technically has its own beginning, middle, and end, but a screenwriter should almost never show all three. Instead, enter a scene at the last possible moment before its key reveal, and cut away the instant that reveal is delivered — trusting the audience to fill in everything left out.", "book": "Screenwriter's Workbook", "chapter": "10 - The First Ten Pages", "chapterNum": "10"}, {"term": "\"Film Is Behavior\"", "definition": "The principle that we come to know who a character is by watching what they do, not by what they say — a character's true nature is revealed through action and behavior rather than through dialogue or exposition.", "book": "Screenwriter's Workbook", "chapter": "06 - The Tools of Character", "chapterNum": "06"}, {"term": "\"Good Read\"", "definition": "A script that reads well from page one: crisp, sparse, visual prose; a strong inciting incident; appealing three-dimensional characters; a clear premise and situation established within the first ten pages; and, critically, a script not cluttered with excess characters or subplots.", "book": "Screenwriter's Workbook", "chapter": "17 - The Good Read", "chapterNum": "17"}, {"term": "\"Open It Up\"", "definition": "A visual-pacing technique urging writers to avoid stringing together scene after scene as simple interior-to-interior cuts, and instead show characters moving through physical space (leaving a building, hailing a cab, entering a lobby) — a reminder that a screenplay is a sequence of pictures, not a filmed stage play.", "book": "Screenwriter's Workbook", "chapter": "11 - The Second and Third Ten Pages", "chapterNum": "11"}, {"term": "\"The Type\"", "definition": "A concept borrowed from F. Scott Fitzgerald's observation that \"when you begin with an individual, you create a type\" — the idea that a truly specific, well-drawn individual character can become a broader cultural archetype other people recognize or even imitate. The craft implication is that specificity, not generality, is what makes a character resonate universally.", "book": "Screenwriter's Workbook", "chapter": "05 - What Makes Good Character", "chapterNum": "05"}, {"term": "3x5 Card Method (Act I)", "definition": "A technique for outlining Act I using index cards, one scene or idea per card in a few words only (never a full scene description, so the scene is discovered fresh when actually written). Field's rule of thumb: about fourteen cards tends to work well for Act I — thirteen is usually too thin, fifteen is usually too much — with Card 1 as the opening and the final card as Plot Point I.", "book": "Screenwriter's Workbook", "chapter": "09 - Structuring Act I", "chapterNum": "09"}, {"term": "Aristotle's Three Unities", "definition": "The classical dramatic principle of unity of time, place, and action, which Field cites as the root reason Act I functions as one self-contained unit of action rather than a loose collection of scenes.", "book": "Screenwriter's Workbook", "chapter": "03 - The Paradigm", "chapterNum": "03"}, {"term": "Attitude (Character Quality)", "definition": "A character's intellectual judgment or opinion about something — a sense of right/wrong or superior/inferior — distinguished from point of view but closely related to it; Field treats the boundary between the two as loose rather than a strict rule.", "book": "Screenwriter's Workbook", "chapter": "05 - What Makes Good Character", "chapterNum": "05"}, {"term": "Back Story", "definition": "What happens to your main character a day, a week, or even just an hour before your screenplay begins — a specific, emotionally-loaded incident (not a mundane errand) that the character carries, unspoken, into the opening scene. A strong back story lets the writer start the script on page one with real tension already loaded into the character, because the writer knows exactly what's underneath the character's behavior even though the audience doesn't yet. A back story that becomes compelling enough can migrate into becoming the actual dramatized opening, at which point a new back story is needed behind it.", "book": "Screenwriter's Workbook", "chapter": "09 - Structuring Act I", "chapterNum": "09"}, {"term": "Bookend Technique", "definition": "A structural device where a short scene or sequence set in the narrative present opens the film, the bulk of the story is then told (often via flashback), and the film returns to that same present-tense scene to close — used in films like Pulp Fiction, Sunset Boulevard, and The Bridges of Madison County.", "book": "Screenwriter's Workbook", "chapter": "0
